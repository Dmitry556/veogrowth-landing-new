tent": {"subject": null, "body": "Thanks for connecting, Miles. You're on Signifyd for checkout fraud, which leaves returns fraud, claim abuse, and coupon testing mostly uncovered. Wyllo does both in one platform. Given the Summer drop volume, would it be worth comparing approval rates and what a returns policy like yours leaks? I can send a short comparison if useful.", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_miles_4", "thread_id": "t_miles_weddle", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 4, "timing_reasoning": "Fallback if the connection request is not accepted, so the LinkedIn angle still reaches him.", "channel_reasoning": "InMail delivers without acceptance and mirrors the DM's intent for the no-acceptance path.", "content_reasoning": "Complementary to the DM branch; short, one question, distinct phrasing.", "content": {"subject": "Returns and claims fraud at Denim Tears", "body": "Hi Miles, I sent a connection request and am trying you here too. Denim Tears runs Signifyd for checkout fraud, but the Summer drop and current sale also drive return abuse, claims, and coupon testing that checkout screening misses. Wyllo covers both sides. Would a short comparison on approval rates and returns be worth fifteen minutes?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_seegars_1", "thread_id": "t_michael_seegars", "channel": "email", "step_type": "email", "day_offset": 2, "timing_reasoning": "Staggered two days after the lead so the ops flank follows the growth touch, and the cross-reference to Miles is true by then.", "channel_reasoning": "Email carries the workflow framing and the truthful colleague mention.", "content_reasoning": "Speaks to the manual-exception burden in his queue and cross-references the Miles touch to prove account-level homework.", "cont e": "economic_buyer", "responsibility": "Owns margin discipline and vendor cost; signs off on the Forter spend and sees the approval-rate impact on revenue.", "linkedin_url": "https://www.linkedin.com/in/lindsay-drucker-mann-2595a359", "email": "ldm@oddity.com", "phone": "+1 917-750-5881", "photo_url": "", "person_page": "/wyllo-demo/people/lindsay-drucker-mann-2595a359.html"}, "targeting_reasoning": "The cost thread. Her Q1 commentary put margin and first order recovery front and center, so total cost per approved order versus Forter lands natively at her desk. Escalation thread, activated only if the lead stays silent.", "angle": {"campaign": "incumbent_displacement", "summary": "Lower fraud tooling cost versus Forter while holding or improving approval rate.", "reasoning": "Finance evaluates cost per approved order, not fraud features. This is the only thread that carries the concrete half-cost pricing fact, because cost is what lands here."}, "why_now_ref": null}], "steps": [{"step_id": "s_cx_ops_1", "thread_id": "t_cx_ops", "channel": "email", "step_type": "email", "day_offset": 0, "timing_reasoning": "Play opener on the lead thread, sent Monday so the LinkedIn and escalation touches sit inside the same work week.", "channel_reasoning": "Email first: the returns and claims angle needs a forwardable artifact, and CX leaders read a specific, low-pressure note.", "content_reasoning": "Anchor on the public June TBYB return-policy testing and the returns queue; introduce behavior-based returns risk; one question about how they handle return abuse now. No cost claim, no asserted Forter gap.", "content": {"subject": "Returns risk while TBYB is in flux", "body": "Hi Sam, ODDITY's Q1 call in June mentioned testing TBYB return policies while paid traffic quality shifted. When acquisition mix moves that fast, the returns and claims queue usually feels it first, through refund abuse and claims that items never arrived. Wyllo scores shopper behavior over time, so trusted customers keep fast returns while repeat abusers get stopped before a refund goes out. It reads risk inside tools like Zendesk. We do this for Credo Beauty, a beauty brand with a similar returns and promo setup. How are you handling return abuse while the TBYB policy is still moving?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cx_ops_2", "thread_id": "t_cx_ops", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 2, "timing_reasoning": "Two days after the email so the name is warm without reading as a same-day blitz.", "channel_reasoning": "Connection note is a low-pressure second surface; acceptance also opens a DM lane later if needed.", "content_reasoning": "Short note nodding to the email on returns during TBYB testing; one line of relevance, no pitch dump.", "content": {"subject": null, "body": null, "note": "Hi Sam, I sent you a note on the returns and claims side while ODDITY is testing TBYB policies. I work with beauty brands on keeping returns fast for good customers while stopping refund abuse. Would be good to connect.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cx_ops_3", "thread_id": "t_cx_ops", "channel": "email", "step_type": "email", "day_offset": 6, "timing_reasoning": "Six-day silence window on the opener, still inside week-one attention, past inbox triage.", "channel_reasoning": "Same channel as the opener; a follow-up with new information belongs in the thread that holds the artifact.", "content_reasoning": "New angle, not a nudge: the fresh promo-code leakage and one-time-offer abuse, plus that Wyllo sits next to the existing stack. One question about who owns promo abuse.", "content": {"subject": "Promo codes leaking on the coupon sites", "body": "Hi Sam, one more angle on the same problem. Public coupon sites are actively listing and verifying IL MAKIAGE codes right now, which tends to feed abuse of one time offers and first order discounts on top of the returns pressure. Wyllo clusters alias accounts and flags repeat promo abuse before the discount applies, and it sits next to your existing checkout stack rather than replacing it. Is promo and first order abuse something your CX team tracks today, or does it land somewhere else?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ceo_1", "thread_id": "t_ceo", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Day 1, one day after the lead email so the cross-reference to Sam is factually true when it sends.", "channel_reasoning": "Email to the CEO: the approval-rate case is a company-level, forwardable number question.", "content_reasoning": "Frame the June CPA jump and how noisier traffic makes false declines cost more; Wyllo matches or beats approval running beside Forter; truthfully mention emailing Sam. One question. No cost figure, that is reserved for the CFO thread.", "content": {"subject": "Approval rate as CPA recovers", "body": "Hi Dmitri, the June update described a sudden CPA jump and lower quality paid audiences at IL MAKIAGE. When traffic gets noisier, fraud models tend to decline more good orders, so every recovered approval matters more while acquisition stays expensive. Wyllo runs checkout screening alongside Forter and typically matches or beats approval rate, which turns some of those false declines back into revenue. We do this for Credo Beauty, a beauty brand with a similar model. I also wrote to Sam Cecil about the returns side. Worth a short look at your current approval rate?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ceo_2", "thread_id": "t_ceo", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 3, "timing_reasoning": "Two days after the CEO email; warm name, second surface.", "channel_reasoning": "Connection note opens the DM lane, which is where the approval-rate ask converts if he accepts.", "content_reasoning": "One line referencing the email on approval rate; no pitch.", "content": {"subject": null, "body": null, "note": "Hi Dmitri, I emailed you about approval rate as CPA recovers at IL MAKIAGE. I help beauty brands compare checkout approval and cost against their current fraud vendor. Open to connecting.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ceo_3", "thread_id": "t_ceo", "channel": "linkedin", "step_type": "linkedin_dm", "day_offset": 6, "timing_reasoning": "Fires on acceptance of the connection request; day 6 is the planned slot if acceptance is prompt.", "channel_reasoning": "DM is the payoff of an accepted connection, a natural place to ask for an approval-rate comparison.", "content_reasoning": "Compress the email: false declines cost more while CPA is high, Wyllo matches or beats approval beside Forter, one question. No cost figure.", "content": {"subject": null, "body": "Thanks for connecting, Dmitri. Short version of my email: with CPA still high, false declines from checkout screening quietly cost more than they used to. Wyllo runs beside Forter and usually matches or beats approval rate, so fewer good orders get turned away. Would you be open to comparing your current approval rate on a call?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ceo_4", "thread_id": "t_ceo", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 6, "timing_reasoning": "Fallback branch: only if the connection request sits unaccepted after three days.", "channel_reasoning": "InMail bypasses the pending connection and carries the same approval-rate ask the DM would have.", "content_reasoning": "Same brief as the DM in a self-contained InMail; skipped if the acceptance branch fired.", "content": {"subject": "Approval rate while CPA is high", "body": "Hi Dmitri, I sent a note earlier this week too. With the June CPA jump at IL MAKIAGE, checkout screening tends to decline more good orders right when each sale costs more to win. Wyllo runs alongside Forter and typically matches or beats approval rate. Would you be open to a comparison of your current numbers?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cfo_1", "thread_id": "t_cfo", "channel": "email", "step_type": "email", "day_offset": 7, "timing_reasoning": "Escalation gate: activates only if the lead thread stays silent through day 7, so flanking to finance follows silence rather than pre-empting the champion.", "channel_reasoning": "Finance is email native; a cost per approved order comparison is a forwardable artifact.", "content_reasoning": "Cost framing tied to her Q1 margin commentary; state the one authorized pricing fact that Wyllo comes in at roughly half the cost of Forter while holding approval; truthfully mention emailing Sam so a forward reads as follow-through. One ask.", "content": {"subject": "Cost per approved order vs Forter", "body": "Hi Lindsay, ODDITY's Q1 readout put margin and first order economics front and center while remediation runs. Fraud tooling sits inside that math in two places: the fees you pay Forter, and the good orders declined at checkout. Wyllo comes in at roughly half the cost of Forter and typically matches or beats approval rate, so the line item drops while approved revenue holds or rises. I also wrote to Sam Cecil about the returns side. Could I send a one page cost comparison for your team to check?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cfo_2", "thread_id": "t_cfo", "chann r touch instead of arriving cold."}, {"edge_id": "e_wait_1", "type": "wait_no_reply", "from_step": "s_cx_ops_1", "to_step": "s_cx_ops_3", "wait_days": 6, "reasoning": "The promo-abuse follow-up only makes sense against silence; a reply moves the thread to human handling and this step is skipped."}, {"edge_id": "e_seq_2", "type": "sequence", "from_step": "s_ceo_1", "to_step": "s_ceo_2", "reasoning": "The CEO email precedes the connection note so the note references a real earlier touch."}, {"edge_id": "e_acc_1", "type": "wait_accepted", "from_step": "s_ceo_2", "to_step": "s_ceo_3", "wait_days": 3, "reasoning": "The DM lane only exists after acceptance; three-day window before falling back."}, {"edge_id": "e_noacc_1", "type": "wait_no_reply", "from_step": "s_ceo_2", "to_step": "s_ceo_4", "wait_days": 3, "reasoning": "Complement of e_acc_1: if the request is unaccepted after three days, InMail carries the same ask; whichever branch fires, the other step is skipped."}, {"edge_id": "e_esc_1", "type": "wait_no_reply", "from_step": "s_cx_ops_1", "to_step": "s_cfo_1", "wait_days": 7, "reasoning": "Cross-thread escalation gate: the finance thread activates only if the lead champion ignored the opener, so flanking follows silence rather than pre-empting the champion."}, {"edge_id": "e_seq_3", "type": "sequence", "from_step": "s_cfo_1", "to_step": "s_cfo_2", "reasoning": "The cost email is the pretext for the call; a call without the artifact in her inbox is a cold call."}, {"edge_id": "e_same_1", "type": "same_day", "from_step": "s_cfo_2", "to_step": "s_cfo_3", "reasoning": "The voicemail is the immediate no-answer branch of the call attempt, left the same session."}, {"edge_id": "e_xref_1", "type": "cross_reference", "from_step": "s_cx_ops_1", "to_step": "s_ceo_1", "reasoning": "The CEO email citing a real email to Sam proves this is an account-level effort, not a spray, and creates internal echo.", "reference_note": "Mention that Sam Cecil was emailed about the returns side  exactly the after-checkout surface Wyllo covers and a checkout-only vendor does not.", "priority": "P1", "window": {"start_date": "2026-07-27"}}, "threads": [{"thread_id": "t_cx_returns", "person": {"name": "Jonathan Barrios", "title": "Customer Service & Supply Chain Operations Leader with 15+ years of experience driving performance across logistics, inventory management, and customer experience.", "role": "champion", "responsibility": "Runs customer service and aftersales operations where returns, refunds, exchanges, warranty, and authenticity claims land before anyone calls them fraud.", "linkedin_url": "https://www.linkedin.com/in/jonathan-barrios-b86611109", "email": "jb@jacquesmariemage.com", "phone": "+1 949-614-3772", "photo_url": "https://media.licdn.com/dms/image/v2/D5603AQGQJCs_CSS1yg/profile-displayphoto-crop_800_800/B56ZiFiFiVHUAM-/0/1754586964270?e=1786579200&v=beta&t=uGeyWJhBBZWwRgvao_IaAJrxaPplgXsXtp_o_S6BDH4", "person_page": "/wyllo-demo/people/jonathan-barrios-b86611109.html"}, "targeting_reasoning": "Lead person: his desk owns the returns, warranty, and authenticity claims that replica and counterfeit activity generates, so the fraud-threat evidence maps directly to a pain he already feels. Best internal champion because Wyllo removes work from his queue.", "angle": {"campaign": "fraud_threat", "summary": "Replica and counterfeit activity around JMM models hits CS as authenticity and warranty claims before it looks like fraud.", "reasoning": "The dated signals (Reddit replica thread, counterfeit dealer guide, sold-out drop) are operational, not financial, and land in his support tools first. Framing is repeat-abuser context inside the queue he already runs."}, "why_now_ref": null}, {"thread_id": "t_finance", "person": {"name": "Andrea Tonello", "title": "Chief Financial Officer", "role": "economic_buyer", "responsibility": "Owns finance, chargebacks, payment reconciliation, and the fraud-vendor spend; the cost and approval-rate case is decided at this desk.", "linkedin_url": "https://www.linkedin.com/in/andreatonello", "email": "andrea.tonello@jacquesmariemage.com", "phone": "+1 917-832-3885", "photo_url": "https://media.licdn.com/dms/image/v2/C4E03AQGwexcuqznujg/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1516289421131?e=1786579200&v=beta&t=7AtyM8OHa5w5o5tz8DwNqnuBNz6HNbzVTUnE3cjuUz4", "person_page": "/wyllo-demo/people/andreatonello.html"}, "targeting_reasoning": "Economic buyer and the cost-owning thread: the open Staff Accountant role points to active chargeback and reconciliation load under finance, and the Forter cost plus false-decline economics are decided here. Behind an escalation gate so the flank only opens after the champion is silent.", "angle": {"campaign": "incumbent_displacement", "summary": "Match or beat approval rates at roughly half the Forter cost, plus the after-checkout abuse coverage Forter lacks.", "reasoning": "Finance evaluates cost and risk, not fraud queues, so this is the only thread carrying the authorized half-cost figure. One contextualized proof point, matter-of-fact tone."}, "why_now_ref": null}, {"thread_id": "t_it", "person": {"name": "Oliver Grant", "title": "Director of IT", "role": "technical_evaluator", "responsibility": "Director of IT owning Shopify, NetSuite, Celigo, and Zendesk integrations; assesses how a risk tool fits the stack without adding manual work.", "linkedin_url": "https://www.linkedin.com/in/olivergrantcarrasco", "email": "oliver.grant@jacquesmariemage.com", "phone": "+1 414-403-7447", "photo_url": "https://media.licdn.com/dms/image/v2/D5603AQF3lhYTjrxRnA/profile-displayphoto-crop_800_800/B56ZjoBdhQHcAI-/0/1756239355415?e=1786579200&v=beta&t=KfRtJGEKR0L43nNaFKc_GABb6RgwirEDetewCRYwQ-Q", "person_page": "/wyllo-demo/people/olivergrantcarrasco.html"}, "targeting_reasoning": "Technical evaluator: the Business Systems Analyst role reports to him and covers exactly the Shopify, NetSuite, Celigo, and Zendesk surface a risk tool integrates with. He decides whether Wyllo fits the stack cleanly.", "angle": {"campaign": "fraud_threat", "summary": "Wyllo scores orders and claims inside the existing Shopify, NetSuite, and Zendesk workflow and replaces only the fraud vendor.", "reasoning": "IT will not evaluate fraud economics but will gate on integration reality. Plain workflow language: what it touches, what it replaces, and that scores land inside tools people already use."}, "why_now_ref": null}], "steps": [{"step_id": "s_cx_returns_1", "thread_id": "t_cx_returns", "channel": "email", "step_type": "email", "day_offset": 0, "timing_reasoning": "Play opener to the lead person; lands day 0 so the LinkedIn follow-ups and the two flanking threads all sit inside the same window.", "channel_reasoning": "Email first: the fraud-threat evidence and the case-study reference need a forwardable artifact, and CS lives in email and Zendesk.", "content_reasoning": "Anchor on the dated replica and counterfeit signal, show it lands in his queue as authenticity and warranty claims, one Brew Watch proof point, one question about how his team sorts those claims now.", "content": {"subject": "Replica JMM frames and your returns queue", "body": "Hi Jonathan, JMM's limited edition drops and the Haider Ackermann Melchior release are getting real attention, and some of it is the wrong kind: replica activity around JMM models is showing up on Reddit and counterfeit guides now flag the brand. That activity usually reaches your team first, as authenticity questions, returns, and warranty claims, before it looks like fraud. Wyllo scores this behavior over time so repeat abusers surface inside your support tools while genuine collectors get faster returns. Brew Watch Company, a brand with a similar model, catches bad orders before a valuable item ships. Are counterfeit and warranty claims something your team is sorting manually right now?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cx_returns_2", "thread_id": "t_cx_returns", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 2, "timing_reasoning": "Two days after the email so the name is warm but it does not read as a same-day blitz; acceptance also opens the DM lane.", "channel_reasoning": "Connection note is the low-pressure second surface and, if accepted, unlocks the DM where the evidence can be shown conversationally.", "content_reasoning": "One line of relevance about the returns and authenticity claims after limited edition drops; no pitch, no repeat of the email.", "content": {"subject": null, "body": null, "note": "Hi Jonathan, I work with luxury DTC brands on the returns and authenticity claims that land in customer service after limited edition drops. Given the recent JMM releases and the replica chatter around a few models, thought it was worth connecting.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cx_returns_3", "thread_id": "t_cx_returns", "channel": "linkedin", "step_type": "linkedin_dm", "day_offset": 5, "timing_reasoning": "Fires on acceptance of the connection request; day 5 is the planned slot if acceptance is prompt.", "channel_reasoning": "DM is the payoff of the accepted connection, the place to show the repeat-abuser context inside Zendesk conversationally.", "content_reasoning": "New angle from the email: the abuse hits support before finance sees a chargeback, Wyllo flags repeat abusers inside Zendesk, one question about the collaboration frames.", "content": {"subject": null, "body": "Thanks for connecting, Jonathan. The replica and counterfeit activity around JMM models tends to show up in support as authenticity disputes and warranty claims before finance ever sees a chargeback. Wyllo flags repeat abusers inside Zendesk so your team is not judging each case from scratch. How are you handling authenticity claims on the collaboration frames today?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_cx_returns_4", "thread_id": "t_cx_returns", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 7, "timing_reasoning": "Fallback branch: only if the connection request sits unaccepted after five days.", "channel_reasoning": "InMail bypasses the pending connection and carries the same evidence the DM would have.", "content_reasoning": "Compressed version of the DM brief with fresh wording: abuse reaches CS first, Wyllo surfaces repeat abusers in the tools they use, one question. Skipped if the DM branch fired.", "content": {"subject": "Authenticity claims on the JMM drops", "body": "Hi Jonathan, reaching out because the replica activity around JMM models usually reaches customer service first, as authenticity disputes, returns, and warranty cases, before it reads as fraud anywhere else. Wyllo scores shopper behavior over time so repeat abusers show up inside the tools your team already uses and genuine collectors keep fast service. How is your team sorting authenticity claims on the limited edition frames right now?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_finance_1", "thread_id": "t_finance", "channel": "email", "step_type": "email", "day_offset": 5, "timing_reasoning": "Escalation: opens only after the champion has been silent five days; flanking to the CFO earlier would burn the lead thread.", "channel_reasoning": "Finance is an email-native audience and a cost-and-coverage note is a forwardable artifact.", "content_reasoning": "Cost thread: the open Staff Accountant role signals chargeback load, state the authorized half-cost figure once, add the after-checkout coverage Forter lacks, one qualitative Credo proof point, disclose the Jonathan email so a forward reads as follow-through.", "content": {"subject": "Forter cost and the chargeback load behind it", "body": "Hi Andrea, your open Staff Accountant role points to real hours going into chargebacks and merchant processor reconciliation. Wyllo typically matches or beats approval rates and comes in at roughly half the cost of Forter, so the fraud line and the false declines both shrink. It also covers the returns and authenticity abuse that appears after checkout, worth comparing against what Forter covers there. Credo Beauty, a brand with a similar Shopify Plus model, is a close comparison. I wrote to Jonathan Barrios about the support side. Open to comparing the numbers on approved orders?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_finance_2", "thread_id": "t_finance", "channel": "phone", "step_type": "phone_call", "day_offset": 8, "timing_reasoning": "Three days after the finance email so the email is the pretext for the call rather than a cold dial.", "channel_reasoning": "One live-touch attempt on the play; the finance thread is the closing lane and a call converts the forwarded email into a conversation.", "content_reasoning": "Beats only: reference the email, gesture at approval-rate and coverage value without restating the half-cost figure, ask who owns the fraud-vendor review, hand off to voicemail on no answer.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Open with a greeting to Andrea and name yourself and Wyllo.", "Reason for the call: the email you sent about the Forter cost and the chargeback workload the open Staff Accountant role points to.", "One line: comparable approval rates plus the returns and authenticity coverage after checkout.", "Ask who owns the fraud vendor review internally.", "If no answer, leave the voicemail and note the email is in the inbox for reference."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "no aud vendor, nothing else in the stack. Risk scores show up inside the tools people already use, so nobody logs into another dashboard. I wrote to Jonathan Barrios about the returns and authenticity side. Would a short integration walkthrough be useful?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_it_2", "thread_id": "t_it", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 6, "timing_reasoning": "A few days after the IT email so the name is familiar; light second surface, no urgency.", "channel_reasoning": "Connection note is the low-pressure second channel for a technical evaluator who may not answer a first cold email.", "content_reasoning": "One line tying Wyllo to the Shopify, NetSuite, and Zendesk integration surface his BSA role is scaling; no pitch, no repeat of the email.", "content": {"subject": null, "body": null, "note": "Hi Oliver, I work on fraud and risk tooling that plugs into Shopify, NetSuite, and Zendesk without adding manual work. Given the systems scaling in your Business Systems Analyst role, thought it was worth connecting.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}], "edges": [{"edge_id": "e_seq_1", "type": "sequence", "from_step": "s_cx_returns_1", "to_step": "s_cx_returns_2", "reasoning": "Email before the connection request so the note lands on a name already seen rather than fully cold."}, {"edge_id": "e_acc_1", "type": "wait_accepted", "from_step": "s_cx_returns_2", "to_step": "s_cx_returns_3", "wait_days": 3, "reasoning": "The DM lane only exists once the connection is accepted; three-day window before falling back."}, {"edge_id": "e_noacc_1", "type": "wait_no_reply", "from_step": "s_cx_returns_2", "to_step": "s_cx_returns_4", "wait_days": 5, "reasoning": "If/else complement of e_acc_1: unaccepted after five days routes the evidence through InMail instead, and the untaken branch is skipped."}, {"edge_id": "e_esc_1", "type": "wait_no_reply", "from_step": "s_cx_returns_1", "to_step": "s_finance_1", "wait_days": 5, "reasoning": "Cross-thread escalation gate: the finance flank opens only if the champion ignored the opener, so we do not go over his head prematurely."}, {"edge_id": "e_seq_2", "type": "sequence", "from_step": "s_finance_1", "to_step": "s_finance_2", "reasoning": "The email is the pretext for the call; a call without the artifact in her inbox is a cold call."}, {"edge_id": "e_same_1", "type": "same_day", "from_step": "s_finance_2", "to_step": "s_finance_3", "reasoning": "Voicemail is the immediate no-answer branch of the call attempt, left the same session."}, {"edge_id": "e_seq_3", "type": "sequence", "from_step": "s_it_1", "to_step": "s_it_2", "reasoning": "Email before the connection note so the second surface leans on a real prior touch."}, {"edge_id": "e_xref_1", "type": "cross_reference", "from_step": "s_cx_returns_1", "to_step": "s_finance_1", "reasoning": "The finance email discloses the prior contact so a forward down to CS reads as follow-through, not a flank.", "reference_note": "State that Jonathan Barrios was emailed about the customer service and returns side; frame this as the cost view of the same question. Do not repeat that email's content."}, {"edge_id": "e_xref_2", "type": "cross_reference", "from_step": "s_cx_returns_1", "to_step": "s_it_1", "reasoning": "Naming the real email to Jonathan proves this is an account-level effort and gives the IT owner an internal reference point.", "reference_note": "Mention the email sent to Jonathan Barrios about the returns and authenticity side; do not repeat its content."}], "created_at": "2026-07-23T00:00:00Z", "updated_at": "2026-07-23T00:00:00Z", "status": "draft", "verified": true}, "makeupbymario.com": {"schema_version": "1.0", "play_id": "play_makeupbymario_2026w30", "account": {"domain": "makeupbymario.com", "name": "Makeup By Mario", "icp_score": "HIGH", "incumbent": ["Forter", "Signifyd"], "dossier_ref": "deep_research/play_inputs/makeupbymario_bundle.md#durable-dossier", "brief_refs": ["deep_research/play_inputs/makeupbymario_bundle.md#why-now-brief"]}, "strategy": {"campaigns": ["incumbent_displacement"], "thesis": "Makeup By Mario runs Forter and Signifyd for checkout while its operating surface expands into TikTok Shop, affiliate bundles, public coupon circulation, one account discount terms, bulk purchase return refusal, and Global-e international checkout. Those affiliate, promo, and post purchase decisions sit around checkout, not at card authorization. Wyllo matches checkout screening and scores one shopper history across promotions, returns, and claims, so creator and affiliate behavior connects to the post purchase decisions the checkout vendors do not judge.", "reasoning": "Forter and Signifyd are the standing incumbents, and the sharper why-now is that the brand moved from DTC-only into TikTok Shop, affiliate bundles, public discounting, and international checkout, per the brief. No confirmed fraud incident was found, so the motion is a benchmark on policy abuse and CX breadth, not a threat pitch. That maps a displacement pitch to ecommerce (Michael), social commerce (Deissy), and the CFO who owns vendor cost.", "priority": "P1", "window": {"start_date": "2026-07-23"}}, "threads": [{"thread_id": "t_michael_hastings", "person": {"name": "Michael J. Hastings", "title": "VP, Ecommerce", "role": "champion", "responsibility": "Owns ecommerce across Shopify, TikTok Shop, affiliate bundles, and the promo and returns policy surface.", "linkedin_url": null, "email": "michael@makeupbymario.com", "phone": null, "photo_url": null, "person_page": "/wyllo-demo/people/michael-j-hastings-makeupbymario-com.html"}, "targeting_reasoning": "He is the likely ecommerce owner across Shopify, TikTok Shop, and affiliate bundles, so connecting creator and affiliate behavior to checkout and returns is his to drive. No phone or LinkedIn is on file, so this thread is email only.", "angle": {"campaign": "incumbent_displacement", "summary": "As social commerce moves from campaign to channel, the hard part is connecting affiliate and TikTok Shop behavior to checkout, returns, refunds, and bulk purchase rules, which the checkout vendors do not score.", "reasoning": "His remit spans exactly the affiliate and post purchase surface the wedge targets."}}, {"thread_id": "t_deissy_villa", "person": {"name": "Deissy Villa Morocho", "title": "Director of Social Commerce at Makeup By Mario", "role": "influencer", "responsibility": "Leads social commerce and the affiliate and creator programs, including the TikTok Affiliate Education Event.", "linkedin_url": "https://www.linkedin.com/in/deissyvilla", "email": "deissyvilla@makeupbymario.com", "phone": "+1 914-502-8057", "photo_url": "https://media.licdn.com/dms/image/v2/D4E03AQHTVdmy53GiYw/profile-displayphoto-crop_800_800/B4EZ0txUwjGkAI-/0/1774589400620?e=1786579200&v=beta&t=rs1JmFkfmABIpa5cBoEAbNEn8q7EIb6-znClRx5yN-0", "person_page": "/wyllo-demo/people/deissyvilla.html"}, "targeting_reasoning": "She has the freshest own-voice signal running the affiliate education event and scaling social commerce, so the creator-to-checkout connection is felt first in her programs.", "angle": {"campaign": "incumbent_displacement", "summary": "As creator and affiliate programs scale, the exceptions around bundles, seeding, discounts, and returns multiply; scoring one shopper history keeps that clean without slowing real customers.", "reasoning": "Her programs generate the affiliate and promo behavior that needs to connect to the post purchase decisions."}}, {"thread_id": "t_tony_gajewski", "person": {"name": "Tony Gajewski", "title": "CFO/COO -Makeup by Mario", "role": "economic_buyer", "responsibility": "Owns vendor cost, control, and the ROI case for fraud-tool spend.", "linkedin_url": "https://www.linkedin.com/in/tony-gajewski-94369912", "email": "tony@make rson": {"name": "Janice Kim", "title": "Senior Manager, Global E-Commerce at OLAPLEX", "role": "technical_evaluator", "responsibility": "Site merchandising and global ecommerce operations: Shopify product and promo setup, promotional SKU inventory, and CS, warehouse and ops liaison.", "linkedin_url": "https://www.linkedin.com/in/janice-kim-31953445", "email": "janice.kim@olaplex.com", "phone": "+1 201-556-8812", "photo_url": "https://media.licdn.com/dms/image/v2/D4E03AQH89wkvvjXv0A/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1702911630833?e=1786579200&v=beta&t=5IzAUDRzTblrA0OPaqxtfSF_xtE2eNSNWc67kE8IaB8", "person_page": "/wyllo-demo/people/janice-kim-31953445.html"}, "targeting_reasoning": "The brief names her as the operational validator for whether a risk system actually fits OLAPLEX's Shopify, promo and inventory workflows.", "angle": {"campaign": "incumbent_displacement", "summary": "Integration reality: a risk system that installs on Shopify, runs alongside the current vendor, and scores checkout, promo eligibility and returns without blocking real shoppers.", "reasoning": "Process-level altitude for the operator; plain workflow language about Shopify fit, promo SKU and returns exceptions, no marketing framing."}, "why_now_ref": null}], "steps": [{"step_id": "s_tierney_1", "thread_id": "t_tierney_wilson", "channel": "email", "step_type": "email", "day_offset": 0, "timing_reasoning": "Lead thread opens the play on day 0 with the exec closest to the DTC budget and the why-now.", "channel_reasoning": "Email carries the forwardable, number-bearing artifact and is the primary surface for an exec.", "content_reasoning": "Plainly states the displacement value prop keyed to the Henkel close and live promos, with a single comparison ask.", "content": {"subject": "Forter and OLAPLEX DTC after the Henkel close", "body": "Hi Tierney,\n\nWith OLAPLEX now part of Henkel and DTC promos like the SHINE gift set running across your storefronts, this upplies none.", "content": {"subject": "One place for checkout, promos, and returns", "body": "Following my earlier note, one example of what I mean. Credo Beauty runs a similar premium beauty model on Shopify and moved checkout approval, promo eligibility, and returns and claims checks into one place, so trusted shoppers get faster returns while repeat abuse gets caught consistently. I also wrote to Alexandra Alessi about the CX side of this. If it helps, I can share how the same setup would map to your SHINE and subscription offers. Open to a short call next week?\n\nThanks,\nWyllo", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tierney_4", "thread_id": "t_tierney_wilson", "channel": "phone", "step_type": "phone_call", "day_offset": 10, "timing_reasoning": "Phone attempt after continued email silence, four days after the second email is already in her inbox.", "channel_reasoning": "A call converts the email into a conversation; it uses the email as pretext, not a cold dial.", "content_reasoning": "Beats point back to the sent email and the one proof point, with a clear 15 minute ask.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Open: introduce yourself and Wyllo, ask if Tierney has a moment.", "Reason for calling: the emails about reviewing OLAPLEX risk controls after the Henkel close.", "One point: brands like Credo Beauty score checkout approval, promo eligibility, and returns in one place that runs alongside a setup like Forter.", "Ask: 15 minutes this week to compare approval rates and cost.", "If no answer, leave the voicemail step and stop; do not pitch further."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tierney_5", "thread_id": "t_tierney_wilson", "channel": "phone", "step_type": "voicemail", "day_offset": 10, "timing_reasoning": "Same-day voicemail paired with the call so a missed pickup still lands a pointer to the email.", "channel_reasoning": "Voicemail closes the phone touch by directing her back to the artifact in her inbox.", "content_reasoning": "A roughly 20 second pointer: name, one line, and the email reference; not a pitch.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["State your name and Wyllo in one line.", "One line: we help hair care DTC brands review checkout approval and returns risk together.", "Point to the email sent about OLAPLEX risk controls after the Henkel close.", "Leave a callback number and keep it under 20 seconds."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_alexandra_1", "thread_id": "t_alexandra_alessi", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Champion thread opens day 1, staggered just behind the lead so the account is approached at two altitudes early.", "channel_reasoning": "Email carries the CX and policy-abuse framing she can act on and forward internally.", "content_reasoning": "Function-level angle on the eligibility and returns checks that touch the experience she measures, with a compare-notes ask.", "content": {"subject": "Trusted OLAPLEX shoppers and the SHINE code", "body": "Hi Alexandra,\n\nYou own site experience and retention at Brand.com, so this sits close to your world. With the SHINE gift code being one time per customer, and the student, first order, and subscription offers all carrying their own eligibility rules, a lot of policy checks land on the customer experience. We score shopper behavior over time so trusted customers get faster returns and clean promo redemptions, while duplicate accounts and repeat claims abuse get caught quietly. Would it be worth comparing notes on how OLAPLEX handles that today?\n\nThanks,\nWyllo", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_alexandra_2", "thread_id": "t_alexandra_alessi", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 4, "timing_reasoning": "Connection request three days after the email adds a second surface while the email is still fresh.", "channel_reasoning": "A connection note is the lighter LinkedIn entry and opens the accept-or-not branch.", "content_reasoning": "One line of relevance to her returns and promo policy scope, under 300 characters, no pitch dump.", "content": {"subject": null, "body": null, "note": "Hi Alexandra, I follow how beauty DTC teams keep returns and promo policies from adding friction for good customers. Your Brand.com and retention work at OLAPLEX is right in that space. Would like to connect.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_alexandra_3a", "thread_id": "t_alexandra_alessi", "channel": "linkedin", "step_type": "linkedin_dm", "day_offset": 8, "timing_reasoning": "DM fires only after the connection is accepted, four days after the request.", "channel_reasoning": "A DM on an accepted connection is a warm, conversational one-question touch.", "content_reasoning": "Short, one question about keeping eligibility and returns checks from slowing trusted buyers.", "content": {"subject": null, "body": "Thanks for connecting, Alexandra. With SHINE and the subscription and student offers all live, how does OLAPLEX keep eligibility and returns checks from slowing your trusted repeat buyers? Wyllo scores behavior so good shoppers move faster while risky claims get flagged. Open to trading notes if that is useful?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_alexandra_3b", "thread_id": "t_alexandra_alessi", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 8, "timing_reasoning": "InMail is the fallback if the connection is not accepted by day 8, complementary to the DM branch.", "channel_reasoning": "InMail reaches her without an accepted connection and restates the CX angle briefly.", "content_reasoning": "40 to 80 words, one question, mirrors the email angle without reusing its sentences.", "content": {"subject": "Returns and promo checks that reward good customers", "body": "Hi Alexandra, I lead work with beauty DTC teams on keeping fraud and policy checks from punishing loyal shoppers. With OLAPLEX running SHINE plus student and subscription offers, eligibility and returns decisions touch the experience you measure. Wyllo scores behavior over time so trusted customers get faster returns while duplicate accounts and repeat claims get caught. Worth a short call to compare how it works today?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_janice_1", "thread_id": "t_janice_kim", "channel": "email", "step_type": "email", "day_offset": 2, "timing_reasoning": "Technical thread opens day 2, staggered behind the exec and champion so the operator is engaged once the story is in motion.", "channel_reasoning": "Email is the right surface for a plain integration walkthrough she can evaluate.", "content_reasoning": "Process-level framing on Shopify fit, promo SKU and returns, with a short walkthrough ask.", "content": {"subject": "Fitting a risk tool to your Shopify promo setup", "body": "Hi Janice,\n\nYou run global ecommerce and site merchandising, so you would see fast whether a risk tool actually fits the work. With promo setup, promotional SKU inventory, and returns all moving through Shopify and your CS and warehouse teams, risk checks only help if they avoid blocking real shoppers. Wyllo installs as a Shopify app or API, runs alongside your current fraud vendor, and scores checkout, promo eligibility, and returns in one place. Would a short walkthrough of how it maps to your setup be useful?\n\nThanks,\nWyllo", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_janice_2", "thread_id": "t_janice_kim", "channel": "email", "step_type": "email", "day_offset": 9, "timing_reasoning": "Follow-up on silence, seven days after the first email, adding a new operational angle.", "channel_reasoning": "Email again to carry the returns-exception point and the cross-thread reference.", "content_reasoning": "New angle on returns and promo exceptions hitting CS and warehouse work, plus a truthful mention of the Tierney touch.", "content": {"subject": "How this lands operationally, not just at checkout", "body": "One more thought on fit. The part teams underestimate is returns and promo exceptions, since those land on your CS and warehouse workflows, not just at checkout. Wyllo handles those in the same place, so a flagged claim or an ineligible SHINE redemption is caught before it becomes manual cleanup. I wrote to Tierney Wilson about the wider DTC view of this. If helpful, I can send a one page overview of the Shopify setup. Open to a look?\n\nThanks,\nWyllo", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}], "edges": [{"edge_id": "e_t_seq_1_2", "type": "sequence", "from_step": "s_tierney_1", "to_step": "s_tierney_2", "reasoning": "The LinkedIn engagement follows the opening email as a planned light second surface regardless of reply."}, {"edge_id": "e_t_wait_2_3", "type": "wait_no_reply", "from_step": "s_tierney_2", "to_step": "s_tierney_3", "wait_days": 4, "reasoning": "Send the case-study follow-up only if the earlier touches drew no reply."}, {"edge_id": "e_t_wait_3_4", "type": "wait_no_reply", "from_step": "s_tierney_3", "to_step": "s_tierney_4", "wait_days": 4, "reasoning": "Escalate to a call only after the second email also goes unanswered."}, {"edge_id": "e_t_sameday_4_5", "type": "same_day", "from_step": "s_tierney_4", "to_step": "s_tier atrickta.com_bundle.md", "brief_refs": ["deep_research/play_inputs/patrickta.com_bundle.md"]}, "strategy": {"campaigns": ["fraud_threat", "incumbent_displacement"], "thesis": "Patrick Ta is being targeted across promo, referral, first-order, resale, and chargeback surfaces at the same time, and while Forter screens the checkout, the identity and post-purchase side is a separate coverage question. Lead with the active-targeting angle for the ecommerce and operations owners, and back it with a cost and displacement case reserved for the CFO thread.", "reasoning": "The freshest dated signals are a live summer promo, referral, and first-order stack (patrickta.com offers page), a recent Out Of Office and Ice Me Down bundle reselling near 160 dollars (eBay 177639241123), and an open Senior Accountant role that explicitly owns customer chargebacks and dispute resolution. Forter is the confirmed incumbent but no renewal, module scope, or dissatisfaction signal was found, so fraud-threat is the sharper wedge and displacement stays a finance-side support angle rather than the lead.", "priority": "P1", "window": {"start_date": "2026-07-27"}}, "threads": [{"thread_id": "t_heidi_ecomm", "person": {"name": "Heidi Lim", "title": "VP of Ecommerce", "role": "champion", "responsibility": "Owns DTC conversion, the live promo/referral/first-order stack, launch merchandising, and the customer experience that promo abuse and false declines degrade.", "linkedin_url": null, "email": "heidi@patrickta.com", "phone": "+1 310-754-0204", "photo_url": null, "person_page": null}, "targeting_reasoning": "The abuse surface lives in her stack: summer code, 15 percent first order, and 15 dollar referral are all live now, so she feels promo abuse and false declines directly and is the person who would carry Wyllo internally. Lead thread of the play.", "angle": {"campaign": "fraud_threat", "summary": "Identity and behavior abuse hiding inside the live summer promo, referral, and first-order stack.", "r : "The returns side Forter skips", "body": "Adam, I emailed you a few days ago. On a limited drop like Madhappy the checkout screen is only half of it. Repeat refund and claim abuse, plus reuse of the DIVEIN15 code, land on CX afterward, and Forter does not score those. Wyllo covers checkout and post purchase in one view inside Gorgias. Is refund and claim abuse something your team tracks today?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_adam_5", "thread_id": "t_adam", "channel": "email", "step_type": "email", "day_offset": 6, "timing_reasoning": "Six-day silence window on the opener, still inside week-one attention; a bump belongs in the thread where the artifact lives.", "channel_reasoning": "Same channel as the opener so the case-study proof point sits with the original cost email.", "content_reasoning": "New information, not a nudge: introduce the Monday Swimwear analogue qualitatively, then ask whether the abuse split sits inside Forter or with CX. No pricing repeat.", "content": {"subject": "One more on the ROXY returns question", "body": "One comparison that may be useful after my first email. Monday Swimwear runs a similar seasonal swim model, heavy summer volume and the same customer experience pressure on returns and claims. They moved the repeat abuse decisions into the same system that screens checkout, so trusted buyers kept fast refunds while repeat offenders got stopped. Given the Madhappy drop and the new fragrance line, is that split something ROXY handles inside Forter today, or does it sit with CX?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tim_1", "thread_id": "t_tim", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Day after the opener so the cross-reference to Adam's email is already true; staggered, not blasted on day 0.", "channel_reasoning": "Email is the forwardable format for a channel-risk point and carries the coordination line to Adam.", "content_reasoning": "Frame promo and reseller risk not traveling to marketplaces; cite the DIVEIN15 propagation and Madhappy; reference the email to Adam; ask where marketplace risk sits.", "content": {"subject": "ROXY risk across marketplaces, not just the cart", "body": "Tim, as ROXY discovery and conversion move into marketplaces through the Flywheel work, the promo and reseller patterns you see on roxy.com do not automatically travel to those channels. The DIVEIN15 code is already circulating on public coupon sites, and a drop like Madhappy invites reseller buying. Wyllo scores repeat abuse and reseller behavior consistently across channels, not only the owned cart. I wrote to Adam Kronengold about the checkout and claims side. Where does marketplace risk sit for you today?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tim_2", "thread_id": "t_tim", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 3, "timing_reasoning": "Two days after his email so the second surface follows a real prior touch.", "channel_reasoning": "A light connection note keeps the channel-consistency point present without a second pitch.", "content_reasoning": "One line on keeping promo and reseller risk consistent as ROXY scales into marketplaces; ask how he handles it today; under 300 characters.", "content": {"subject": null, "body": null, "note": "Tim, I emailed you about keeping promo and reseller risk consistent as ROXY scales into marketplaces, not just on roxy.com. Curious how you handle it across channels today.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_piera_1", "thread_id": "t_piera", "channel": "email", "step_type": "email", "day_offset": 2, "timing_reasoning": "Day 2 so it follows the opener and the cross-reference to Adam is true; staggered across the first three days.", "channel_reasoning": "Email suits a merchandising-level note and carries the coordination line to Adam.", "content_reasoning": "Tie the fragrance and personal-care launch to more return, gift, and claim edge cases; reference the email to Adam; ask how the new categories are affecting returns.", "content": {"subject": "New ROXY categories, more return and claim edge cases", "body": "Piera, the fragrance and personal care launch changes the shape of returns and claims for ROXY. Lower priced giftable items get bundled, gifted, and returned differently than swim or snow, and they pair with the DIVEIN15 welcome offer and Seel delivery claims. That mix creates more policy exceptions for CX to judge. Wyllo reads repeat abuse and promo misuse across those SKUs so trusted shoppers still get fast returns. I emailed Adam Kronengold on the digital side. How are the new categories affecting returns so far?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_matt_1", "thread_id": "t_matt", "channel": "email", "step_type": "email", "day_offset": 9, "timing_reasoning": "Escalation: only if Adam is silent three days past his own follow-up. Going over the budget owner's head earlier would burn the lead thread.", "channel_reasoning": "Email is CEO-native and forwardable; a company-level loss-control note lands as follow-through given the disclosed prior contact.", "content_reasoning": "Keep it strategic: loss-control consistency as the platform scales, one ROXY illustration, disclose the email to Adam, ask who owns the decision for the DTC brands. No product detail, no pricing figure.", "content": {"subject": "Loss control as ROXY and the portfolio scale", "body": "Matt, as you scale the platform and add categories, marketplaces, and partners, the consistency of loss control becomes an operat umbent_displacement"], "thesis": "Skullcandy runs Riskified, whose public case names the exact metrics that matter: approvals, false positives, chargebacks, and decline thresholds. With the Crusher 1080 ANC launch live and customer conversations already moving into returns and expectations, it is a natural moment to benchmark whether that same risk visibility carries through the post purchase workflows Riskified does not cover: launch returns, warranty claims, coupon and rewards rules, and repeat customer behavior. Wyllo matches checkout screening and adds that post purchase breadth.", "reasoning": "Riskified is the established incumbent with a public case built on approval rate, false positives, and chargebacks, so the right move is a benchmark tied to the live launch, not an alarmist threat email. The Crusher 1080 ANC launch is the fresh hook, and the wedge is incumbent benchmark plus broader journey coverage. That maps a displacement pitch to ecommerce (Evin), operations and returns (Jillian), and the CFO who owns vendor cost.", "priority": "P1", "window": {"start_date": "2026-07-23"}}, "threads": [{"thread_id": "t_evin_catlett", "person": {"name": "Evin Catlett", "title": "Global VP, Ecommerce & Growth Marketing @ Skullcandy", "role": "champion", "responsibility": "Owns DTC ecommerce, growth, and loyalty and retention across the storefronts, including launch conversion and approval outcomes.", "linkedin_url": "https://www.linkedin.com/in/evincatlett", "email": "evin.catlett@skullcandy.com", "phone": "+1 801-440-1308", "photo_url": "https://media.licdn.com/dms/image/v2/D5603AQEdp9Vub0J7kA/profile-displayphoto-crop_800_800/B56Zm8nSKcHkAI-/0/1759806039032?e=1786579200&v=beta&t=fKv5G3rNLUazMEKBl8bJkOWpwCQXvuWB-BB3cf0IJ_8", "person_page": "/wyllo-demo/people/evincatlett.html"}, "targeting_reasoning": "As the DTC ecommerce owner she carries approval rate and the launch conversion outcomes, so a benchmark against Riskified during the Crusher 1080 launch is hers to driv : "InMail reaches her without an accepted connection.", "content_reasoning": "Restates the benchmark with one ask.", "content": {"subject": "post purchase risk next to your Riskified numbers", "body": "Evin, I sent a connection note and am adding this here too. The Riskified case is strong on checkout, and with the Crusher 1080 launch live the open question is whether that visibility carries into returns and warranty claims. Wyllo screens checkout and scores the same shopper across returns and claims in one history. Would fifteen minutes to put the two side by side, approval rate included, be worth it?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_jillian_1", "thread_id": "t_jillian_hough", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Staggered a day behind the lead so the threads run in parallel.", "channel_reasoning": "Email carries the operations framing she can forward.", "content_reasoning": "Frames launch returns and warranty claims as ops load, names the Evin touch.", "content": {"subject": "launch returns and warranty claims on ops", "body": "Jillian, a flagship launch like the Crusher 1080 usually brings a wave of returns, warranty claims, and item not received claims that land as manual work on operations even after a clean checkout. Wyllo reads a shopper's pattern across orders, so trusted customers get faster returns while repeat abusers and false claims get caught before credit goes out. I sent Evin Catlett the ecommerce side of this. Would a look at your returns and warranty queue be useful?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_jillian_2", "thread_id": "t_jillian_hough", "channel": "phone", "step_type": "phone_call", "day_offset": 5, "timing_reasoning": "The call follows only after the email is unanswered, using it as pretext.", "   function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }
  // kind: "avatar" (cast card) or "thumb" (step chip). Falls back to initials circle.
  function avatarHTML(p, kind) {
    var pic = p && p.photo_url ? String(p.photo_url).trim() : "";
    var imgCls = kind === "thumb" ? "thumb" : "avatar";
    var initCls = kind === "thumb" ? "thumb-init" : "avatar-init";
    if (pic) return '<img class="' + imgCls + '" src="' + esc(pic) + '" alt="">';
    return '<span class="' + initCls + '">' + esc(initials(p && p.name)) + "</span>";
  }

  var STEPTYPE_LABEL = {
    linkedin_connection_note: "LinkedIn \u00b7 Connection request",
    linkedin_dm: "LinkedIn \u00b7 Message",
    linkedin_inmail: "LinkedIn \u00b7 InMail",
    email: "Email",
    phone_call: "Phone call",
    voicemail: "Voicemail"
  };
  function stepTypeLabel(st) { return STEPTYPE_LABEL[st] || titleize(st); }
  function dayText(d) { return d === 0 ? "Day 0" : "Day " + d; }

  // ---- per-play render (PLAY + indexes rebuilt each time) ----
  function renderPlay(PLAY) {
    var threadById = {};
    var colorByThread = {};
    PLAY.threads.forEach(function (t, i) {
      threadById[t.thread_id] = t;
      colorByThread[t.thread_id] = PALETTE[i % PALETTE.length];
    });
    var stepById = {};
    PLAY.steps.forEach(function (s) { stepById[s.step_id] = s; });
    var incoming = {};
    (PLAY.edges || []).forEach(function (ed) {
      (incoming[ed.to_step] = incoming[ed.to_step] || []).push(ed);
    });
    function personOf(step) { return (threadById[step.thread_id] || {}).person || {}; }

    // ---- strategy header ----
    function renderStrategy() {
      var a = PLAY.account, s = PLAY.strategy || {};
      var inc = (a.incumbent || []).join(", ") || "the incumbent";
      var camps = (s.campaigns || []).map(function (c) {
        return '<span class="pill camp">' + esc(titleize(c)) + "</span>";
      }).join(" ");
      var prio = s.priority ? '<span class="pill prio">' + esc(s.priority) + " \u00b7 work now</span>" : "";
      var verif = PLAY.verified
        ? '<span class="pill ok" title="Fact-checked against its research bundle">\u2713 Verified</span>'
        : '<span class="pill pending" title="Not yet fact-checked">Draft \u2014 pending verification</span>';
      var win = (s.window && s.window.start_date)
        ? '<div class="window">Window opens ' + esc(s.window.start_date) + "</div>" : "";
      var nPeople = PLAY.threads.length;
      var peopleWord = nPeople + "-person";
      return '' +
        '<div class="strategy">' +
          '<div class="toprow">' +
            "<h1>" + esc(a.name) + "</h1>" +
            '<span class="domain">' + esc(a.domain) + "</span>" +
            '<span style="flex:1"></span>' + verif + " " + prio + " " + camps +
          "</div>" +
          '<p class="displace">Displace <span class="vs">' + esc(inc) +
            "</span> across a coordinated, " + esc(peopleWord) + " sequence.</p>" +
          (s.thesis ? '<p class="thesis">' + esc(s.thesis) + "</p>" : "") +
          (s.reasoning ? '<p class="reasoning-lite">' + esc(s.reasoning) + "</p>" : "") +
          win +
        "</div>";
    }

    // ---- cast ----
    function touchesFor(threadId) {
      var days = PLAY.steps.filter(function (st) { return st.thread_id === threadId; })
        .map(function (st) { return st.day_offset; });
      var uniq = [];
      days.sort(function (a, b) { return a - b; }).forEach(function (d) {
        if (uniq.indexOf(d) === -1) uniq.push(d);
      });
      var count = PLAY.steps.filter(function (st) { return st.thread_id === threadId; }).length;
      return count + " touch" + (count === 1 ? "" : "es") + " \u00b7 " +
        uniq.map(function (d) { return "Day " + d; }).join(", ");
    }
    // Person name -> clickable link. Prefer the on-site person page; fall back to
    // their LinkedIn profile (new tab) when no person page was injected.
    function personNameLink(p) {
      if (p && p.person_page) {
        return '<a href="' + esc(p.person_page) + '">' + esc(p.name) + "</a>";
      }
      if (p && p.linkedin_url) {
        return '<a href="' + esc(p.linkedin_url) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a>";
      }
      return esc(p && p.name);
    }
    function renderCast() {
      var cards = PLAY.threads.map(function (t) {
        var col = colorByThread[t.thread_id];
        var p = t.person || {};
        var li = p.linkedin_url
          ? ' \u00b7 <a class="li" href="' + esc(p.linkedin_url) + '" target="_blank" rel="noopener">LinkedIn</a>' : "";
        return '' +
          '<div class="person" style="--c:' + col.c + ";--cbg:" + col.bg + '">' +
            '<div class="phead">' + avatarHTML(p, "avatar") +
              '<div class="pmeta">' +
                '<div class="pname"><span class="dot"></span>' + personNameLink(p) + "</div>" +
                '<div class="ptitle">' + esc(p.title || "") + "</div>" +
              "</div>" +
            "</div>" +
            '<span class="rolechip">' + esc(titleize(p.role || "")) + "</span>" +
            '<div class="angle">' + esc((t.angle && t.angle.summary) || "") + "</div>" +
            '<div class="why"><b>Why them:</b> ' + esc(t.targeting_reasoning || "") + "</div>" +
            '<div class="touches">' + touchesFor(t.thread_id) + li + "</div>" +
          "</div>";
      }).join("");
      return '<h2 class="sec">Who we\'re reaching &amp; why</h2><div class="cast">' + cards + "</div>";
    }

    // ---- coordination badges (from incoming edges) ----
    function badge(cls, icon, text, tip) {
      var t = tip ? ' title="' + esc(tip) + '"' : "";
      return '<span class="badge ' + cls + '"' + t + '><span class="ic">' + icon +
        "</span>" + text + "</span>";
    }
    function badgesFor(step) {
      var eds = incoming[step.step_id] || [];
      if (!eds.length) return "";
      var out = eds.map(function (ed) {
        var from = stepById[ed.from_step] || {};
        var fromPerson = personOf(from);
        var fromName = firstName(fromPerson.name);
        var sameThread = from.thread_id === step.thread_id;
        var wd = ed.wait_days;
        if (ed.type === "wait_accepted") {
          return badge("branch", "\u2713", "Only after " + esc(fromName) + " accepts (" + dayText(from.day_offset) + ")");
        }
        if (ed.type === "wait_no_reply") {
          if (!sameThread) {
            return badge("gate", "\u2197", "Escalation \u2014 only if " + esc(fromName) +
              " stays silent " + (wd != null ? wd + " days" : "") );
          }
          return badge("branch", "\u27f3", "If no reply" + (wd != null ? ", " + wd + " days later" : ""));
        }
        if (ed.type === "same_day") {
          return badge("same", "\u25cf", "Same day as the " + esc(stepTypeLabel(from.step_type).toLowerCase()));
        }
        if (ed.type === "cross_reference") {
          return badge("xref", "\u21b3", "Names the outreach to " + esc(fromName), ed.reference_note);
        }
        if (ed.type === "sequence") {
          return badge("same", "\u2192", "Follows the " + esc(stepTypeLabel(from.step_type).toLowerCase()));
        }
        return "";
      }).join("");
      return out ? '<div class="coord">' + out + "</div>" : "";
    }

    // ---- copy block ----
    function renderCopy(step) {
      var c = step.content || {};
      var hasSubject = c.subject && String(c.subject).trim();
      var hasBody = c.body && String(c.body).trim();
      var hasNote = c.note && String(c.note).trim();
      var hasTP = c.talking_points && c.talking_points.length;
      if (!hasSubject && !hasBody && !hasNote && !hasTP) {
        return '<div class="copy"><div class="draft">Draft pending</div></div>';
      }
      var html = '<div class="copy">';
      if (hasSubject) {
        html += '<div class="subj"><b>Subject</b>' + esc(c.subject) + "</div>";
      }
      if (hasBody) {
        html += '<div class="body">' + bodyParas(c.body) + "</div>";
      }
      if (hasNote) {
        html += '<div class="body">' + esc(c.note) + "</div>";
      }
      if (hasTP) {
        html += '<div class="notelabel">Talking points</div><ul class="tp">' +
          c.talking_points.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") +
          "</ul>";
      }
      html += "</div>";
      return html;
    }

    // ---- reasoning strip ----
    function renderReasoning(step) {
      var rows = [];
      if (step.timing_reasoning) rows.push(["When", step.timing_reasoning]);
      if (step.channel_reasoning) rows.push(["Channel", step.channel_reasoning]);
      if (step.content_reasoning) rows.push(["Copy", step.content_reasoning]);
      if (!rows.length) return "";
      var inner = '<div class="rz">' + rows.map(function (r) {
        return '<div class="rzline"><span class="rzk">' + esc(r[0]) +
          '</span><span class="rzv">' + esc(r[1]) + "</span></div>";
      }).join("") + "</div>";
      return '<details class="rz-wrap"><summary><span class="tri">\u25b6</span>Why this move</summary>' +
        inner + "</details>";
    }

    // ---- step card ----
    function renderStep(step) {
      var col = colorByThread[step.thread_id];
      var p = personOf(step);
      return '' +
        '<article class="step" style="--c:' + col.c + '">' +
          '<div class="step-head">' +
            '<span class="who">' + avatarHTML(p, "thumb") + '<span class="dot"></span>' + esc(p.name) +
              (p.title ? ' <span class="who-title">\u00b7 ' + esc(p.title) + "</span>" : "") + "</span>" +
            '<span class="chan ' + esc(step.channel) + '">' + esc(step.channel) + "</span>" +
            '<span class="steptype">' + esc(stepTypeLabel(step.step_type)) + "</span>" +
          "</div>" +
          badgesFor(step) +
          renderCopy(step) +
          renderReasoning(step) +
        "</article>";
    }

    // ---- timeline (chronological, grouped by day) ----
    function renderTimeline() {
      var steps = PLAY.steps.slice();
      steps.forEach(function (s, i) { s._idx = i; });
      steps.sort(function (a, b) {
        return (a.day_offset - b.day_offset) || (a._idx - b._idx);
      });
      var groups = [];
      var cur = null;
      steps.forEach(function (s) {
        if (!cur || cur.day !== s.day_offset) {
          cur = { day: s.day_offset, steps: [] };
          groups.push(cur);
        }
        cur.steps.push(s);
      });
      var html = '<h2 class="sec">The sequence over time</h2><div class="timeline">';
      groups.forEach(function (g) {
        html += '<div class="day">' +
          '<div class="day-label"><span class="day-badge">' + esc(dayText(g.day)) + "</span></div>" +
          '<div class="day-steps">' + g.steps.map(renderStep).join("") + "</div>" +
        "</div>";
      });
      html += "</div>";
      return html;
    }

    document.getElementById("app").innerHTML =
      renderStrategy() + renderCast() + renderTimeline();
    document.getElementById("foot").textContent =
      "Play " + PLAY.play_id + " \u00b7 generated " + (PLAY.created_at || "") +
      " \u00b7 status: " + (PLAY.status || "draft") + " (copy is a draft, not yet sent)";
    document.title = PLAY.account.name + " \u2014 Outreach Play";
  }

  // ---- selector + routing ----
  function currentDomain() {
    var h = (location.hash || "").replace(/^#/, "");
    var m = (location.search || "").match(/[?&]a=([^&]+)/);
    var q = m ? decodeURIComponent(m[1]) : "";
    var want = h || q;
    if (want && PLAYS[want]) return want;
    return ORDER[0].domain;
  }
  function select(domain) {
    if (!PLAYS[domain]) domain = ORDER[0].domain;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-domain") === domain);
    });
    renderPlay(PLAYS[domain]);
    window.scrollTo(0, 0);
  }
  function buildTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = ORDER.map(function (o) {
      return '<button class="tab" data-domain="' + esc(o.domain) + '" type="button">' +
        esc(o.name) + '<span class="dom">' + esc(o.domain) + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () {
        var d = b.getAttribute("data-domain");
        if (location.hash.replace(/^#/, "") !== d) { location.hash = d; }
        else { select(d); }
      });
    });
  }
  window.addEventListener("hashchange", function () { select(currentDomain()); });

  buildTabs();
  select(currentDomain());
})();
</script>
