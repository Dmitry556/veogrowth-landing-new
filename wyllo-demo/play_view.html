he email."}, {"edge_id": "e_6", "type": "cross_reference", "from_step": "s_miles_1", "to_step": "s_seegars_1", "reasoning": "The Seegars email truthfully mentions the earlier Miles email to prove account-level homework.", "reference_note": "Echo that we wrote to Miles about the growth and approval-rate side; the Miles email (day 0) precedes this touch (day 2)."}, {"edge_id": "e_7", "type": "sequence", "from_step": "s_beaudoin_1", "to_step": "s_beaudoin_2", "reasoning": "The LinkedIn note follows the technical email the next day as a second surface."}, {"edge_id": "e_8", "type": "wait_no_reply", "from_step": "s_beaudoin_2", "to_step": "s_beaudoin_3", "wait_days": 4, "reasoning": "If neither the email nor the note draws a reply, send the follow-up email with the unified-score angle."}, {"edge_id": "e_9", "type": "cross_reference", "from_step": "s_miles_1", "to_step": "s_beaudoin_1", "reasoning": "The Beaudoin email truthfully references the earlier Miles email to create internal echo.", "reference_note": "Echo that we emailed Miles on the growth side; the Miles email (day 0) precedes this touch (day 3)."}], "created_at": "2026-07-23T12:00:00Z", "updated_at": "2026-07-23T12:00:00Z", "status": "draft", "verified": true}, "eberjey.com": {"schema_version": "1.0", "play_id": "play_eberjey_2026w30", "account": {"domain": "eberjey.com", "name": "Eberjey", "incumbent": [], "dossier_ref": "deep_research/play_inputs/eberjey.com_bundle.md", "brief_refs": ["deep_research/play_inputs/eberjey.com_bundle.md"]}, "strategy": {"campaigns": ["fraud_threat"], "thesis": "Eberjey's live fraud exposure has moved to where the money now concentrates: a limited Ritz-Carlton capsule at $278 to $298, free 30 day returns with prepaid labels, publicly circulating coupon and welcome codes, and loyalty vouchers. Lead with that dated exposure and Wyllo's coverage across checkout and after the sale, threaded through the digital owner, the CFO, and the CEO.", "reasoning": "The July 13 Ritz-Carlton capsule concentrates high value checkout demand and reseller and account velocity risk into a launch window, while free returns, public coupon codes, and loyalty vouchers create refund and promo abuse on the same shoppers. A network re-scan could not confirm a specific fraud vendor, so the play leads with dated exposure and additive coverage rather than a vendor swap. No fraud-hiring signal was found, so the wedge is coverage breadth across checkout and the customer after the sale.", "priority": "P1", "window": {"start_date": "2026-07-27"}}, "threads": [{"thread_id": "t_kapil_digital", "person": {"name": "Kapil Aggarwal, M.B.A.", "title": "SVP Digital @ Eberjey", "role": "economic_buyer", "responsibility": "Owns the ecommerce surface: launch traffic, checkout approvals, coupon and welcome-offer leakage, and returns friction; the fraud-tool line sits under digital.", "linkedin_url": "https://www.linkedin.com/in/kapilpsu", "email": "kapil.aggarwal@eberjey.com", "phone": "+1 949-292-6626", "photo_url": "https://media.licdn.com/dms/image/v2/D5603AQGGHFYUu60HfQ/profile-displayphoto-crop_800_800/B56Zlv7m4SI0AI-/0/1758519521977?e=1786579200&v=beta&t=66zSWZ_wPe_DJHUjBP0SWb0mXVCtP7ZjQOHcv5VSsVY", "person_page": "/wyllo-demo/people/kapilpsu.html"}, "targeting_reasoning": "Lead thread. SVP Digital owns the surface where the Ritz-Carlton launch, coupon abuse, checkout approvals, and returns risk all converge, and he owns the fraud-tool budget. The brief names Kapil as the lead person with the launch as the hook. His LinkedIn confirms he is currently SVP Digital at Eberjey.", "angle": {"campaign": "fraud_threat", "summary": "Lead with the launch and returns exposure; screen at checkout and catch return and coupon abuse on the same shopper after the sale.", "reasoning": "His live exposure is a high value drop plus free returns and circulating codes, which concentrate reseller, refund, and promo abuse into this window. The angle is dated exposure and additive coverage, framed on the freshest signal he owns."}, "why_now_ref": null}, {"thread_id": "t_ashley_finance", "person": {"name": "Ashley Kadey, CPA", "title": "Chief Financial Officer and Chief Operating Officer at Eberjey", "role": "economic_buyer", "responsibility": "Owns vendor cost, chargeback and refund economics, and operational workload across ecommerce and the new retail footprint.", "linkedin_url": "https://www.linkedin.com/in/ashley-kadey-cpa-baa5469", "email": "ashley.kadey@eberjey.com", "phone": "+1 631-848-9619", "photo_url": "https://media.licdn.com/dms/image/v2/D4E03AQEjPGFImZHqlA/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1669775658341?e=1786579200&v=beta&t=oUi0ftGwZgTXbx6AcWnoqUWXi9uuxKSPxNM1wORzUE0", "person_page": "/wyllo-demo/people/ashley-kadey-cpa-baa5469.html"}, "targeting_reasoning": "The cost-owning thread. As CFO and COO she signs the fraud-vendor invoice and feels chargeback and refund economics, so the cost behind the exposure lands natively here. Activated only if the digital owner stays silent, so the play does not flank the lead thread early. Her LinkedIn confirms she is currently CFO and COO at Eberjey.", "angle": {"campaign": "fraud_threat", "summary": "The cost behind the fraud exposure: recovered revenue from fewer false declines and less refund and promo abuse, at a lower total cost per approved order.", "reasoning": "Finance evaluates cost and workload, not fraud tooling. The one authorized pricing fact lives here, stated generically, paired with recovered revenue and returns coverage, so a forward down to the digital owner reads as follow-through."}, "why_now_ref": null}, {"thread_id": "t_mariela_ceo", "person": {"name": "Mariela Rovito", "title": "Co-Founder and CEO at Eberjey", "role": "influencer", "responsibility": "Owns company-level omnichannel strategy and growth across sales, marketing, finance, operations, and tech.", "linkedin_url": "https://www.linkedin.com/in/marielarovito", "email": "mariela@eberjey.com", "phone": "+1 305-799-4354", "photo_url": "", "person_page": "/wyllo-demo/people/marielarovito.html"}, "targeting_reasoning": "Escalation thread, gated behind silence from the CFO. The CEO cares about protecting omnichannel growth without adding checkout or support friction; a company-level note that names the two colleagues already contacted creates internal echo and forwarding pressure downward. Her LinkedIn confirms she is currently Co-Founder and CEO at Eberjey.", "angle": {"campaign": "fraud_threat", "summary": "Protect the Ritz-Carlton and Nashville momentum by covering the reseller, refund, and coupon abuse that grows with it.", "reasoning": "Exec altitude is company-level growth and risk, not a fraud metric. Framed as protecting the current growth moment, with the cost detail left to the CFO thread rather than repeated here."}, "why_now_ref": null}], "steps": [{"step_id": "s_kapil_1", "thread_id": "t_kapil_digital", "channel": "email", "step_type": "email", "day_offset": 0, "timing_reasoning": "Play opener, sent on the Monday start so the LinkedIn and phone follow-ups sit inside the same work week.", "channel_reasoning": "Email first to the digital owner: the exposure case needs a forwardable artifact anchored on the launch he owns.", "content_reasoning": "Lead with the dated exposure: the July 13 Ritz-Carlton capsule plus free returns and circulating codes, and what Wyllo would cover across checkout and after the sale; one Monday Swimwear proof point, qualitative, one question. No vendor named, no cost claim (that lives in the CFO thread).", "content": {"subject": "Ritz-Carlton launch and where your risk coverage stops", "body": "Hi Kapil, the Ritz-Carlton capsule that launched July 13 puts a run of $278 to $298 orders through checkout in a short window. Limited high value drops like that pull in resellers and fast repeat accounts. Your free returns and the coupon codes circulating publicly also open up refund and welcome offer abuse on the same shoppers. Wyllo screens orders at checkout and keeps reading the same customer after the sale for return fraud and promo abuse. A brand with a similar model, Monday Swimwear, made this move. Does your current setup stop at the sale, or does it flag repeat abusers after it?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_kapil_2", "thread_id": "t_kapil_digital", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 2, "timing_reasoning": "Two days after the email so the name is warm without reading as a same-day blitz.", "channel_reasoning": "Connection note as a light second surface; acceptance also keeps the DM lane open for later.", "content_reasoning": "Short note nodding to the launch and the earlier email without repeating the pitch; second-channel presence, not a second ask.", "content": {"subject": null, "body": null, "note": "Saw the Ritz-Carlton capsule launch. I work with premium apparel brands on screening orders at checkout and catching return and coupon abuse on the same shoppers after the sale. Sent you a short email on it this week and would like to connect.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_kapil_3", "thread_id": "t_kapil_digital", "channel": "email", "step_type": "email", "day_offset": 6, "timing_reasoning": "Follow-up after a six-day silence window on the opener, still inside week-one attention.", "channel_reasoning": "Same channel as the opener; a bump that adds information belongs in the thread where the artifact lives.", "content_reasoning": "New angle, not a nudge: the returns and loyalty abuse that checkout scoring does not judge, tied to free returns and circulating coupon codes; one question offering a choice.", "content": {"subject": "the abuse checkout scoring misses", "body": "Hi Kapil, one piece I left out. Screening the card at checkout is one job. The other is knowing whether the same shopper is a repeat refunder or gaming your welcome offer and loyalty vouchers. With free 30 day returns and public codes floating around, that pattern tends to grow during a launch like the Ritz-Carlton one. Wyllo reads the same customer across the order and the return, so trusted shoppers keep fast returns and the abusers get stopped. Which one costs Eberjey more right now, false declines or refund abuse?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_kapil_4", "thread_id": "t_kapil_digital", "channel": "phone", "step_type": "phone_call", "day_offset": 8, "timing_reasoning": "Two days after the follow-up email so both emails are already in his inbox as the pretext.", "channel_reasoning": "One live attempt on the lead thread; a call converts an email already read into a conversation.", "content_reasoning": "Beats only: name, reference the two emails, the one point on covering checkout plus abuse after the sale, ask who owns the fraud-tool review, and fall back to voicemail.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Kapil, this is [name] from Wyllo, keeping it to twenty seconds.", "Calling on the two emails about the Ritz-Carlton launch and where your risk coverage stops.", "The point: we screen at checkout and also catch return and coupon abuse on the same shopper after the sale.", "Ask whether he owns the fraud tool review or if it sits with finance.", "If no answer, leave a voicemail pointing back at the email."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_kapil_5", "thread_id": "t_kapil_digital", "channel": "phone", "step_type": "voicemail", "day_offset": 8, "timing_reasoning": "Same-day pair with the call; the voicemail is the immediate no-answer branch.", "channel_reasoning": "A twenty-second voicemail pointing back at the emails raises the odds they get opened.", "content_reasoning": "Pointer, not a pitch: name, one line on the launch and the return and coupon abuse that opens up around it, and a nudge to read the email.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Name and Wyllo, twenty seconds.", "Left two notes about the Ritz-Carlton launch and the return and coupon abuse that opens up around it.", "There is one question in the email, worth a read."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ashley_1", "thread_id": "t_ashley_finance", "channel": "email", "step_type": "email", "day_offset": 5, "timing_reasoning": "Fires only after five days of silence from the digital owner, so the CFO flank does not undercut the lead thread early.", "channel_reasoning": "Finance is an email-native audience and a cost delta is a forwardable artifact.", "content_reasoning": "Cost behind the exposure, carrying the single authorized pricing fact stated generically (roughly half the cost of a typical checkout fraud tool), plus recovered revenue and returns coverage; open with the truthful mention that Kapil was emailed.", "content": {"subject": "the cost behind the launch and returns exposure", "body": "Hi Ashley, I wrote to Kapil about the fraud exposure around the Ritz-Carlton launch and free returns, and the cost of it sits with you. Every good order declined is lost revenue, and every abused return or promo code is margin walking out. Wyllo screens checkout and also covers returns and refund claims, and it runs at roughly half the cost of a typical checkout fraud tool. A brand with a similar model, Monday Swimwear, made this move and kept its return experience customer friendly. Would it help to compare your current cost per approved order against ours?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_ashley_2", "thread_id": "t_ashley_finance", "channe CFO thread has gone four days without a reply, so the top of the house is a last flank, not a first touch.", "channel_reasoning": "Email is the forwardable format for a company-level note the CEO can hand down.", "content_reasoning": "Company-level framing: protect the Ritz-Carlton and Nashville growth by covering the reseller, refund, and coupon abuse that grows with it; name that Kapil and Ashley were both contacted; no pricing figure and no vendor named here.", "content": {"subject": "protecting the Ritz-Carlton momentum", "body": "Hi Mariela, I have written to Kapil and Ashley about one risk sitting under your current growth. Between the Ritz-Carlton capsule, the Nashville store, and free returns, Eberjey is pushing more high value orders and more returns through than a year ago. That is where reseller and refund abuse tend to grow. Checkout scoring covers the card at the sale. Wyllo adds return fraud and coupon abuse on the same customer after it, so good shoppers move faster and abuse gets caught. A brand with a similar model, Monday Swimwear, took this path. Open to a short comparison for your team?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_mariela_2", "thread_id": "t_mariela_ceo", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 11, "timing_reasoning": "Two days after the CEO email as a light second surface once the name is warm.", "channel_reasoning": "Connection note keeps a low-pressure presence on a second channel without repeating the email.", "content_reasoning": "Short note nodding to the launch and Nashville opening and the earlier email; relevance line only, no pitch dump, no fake warmth.", "content": {"subject": null, "body": null, "note": "Following the Ritz-Carlton capsule and the Nashville opening, I work with premium apparel brands on screening orders at checkout and catching return and coupon abuse on the same shoppers. I sent a short note on it and would like to connect.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}], "edges": [{"edge_id": "e_seq_1", "type": "sequence", "from_step": "s_kapil_1", "to_step": "s_kapil_2", "reasoning": "Email before the connection note so the note can lean on a real prior touch instead of arriving cold."}, {"edge_id": "e_wait_1", "type": "wait_no_reply", "from_step": "s_kapil_1", "to_step": "s_kapil_3", "wait_days": 6, "reasoning": "The bump only makes sense against silence; a reply moves the thread to human handling and this step is skipped."}, {"edge_id": "e_seq_2", "type": "sequence", "from_step": "s_kapil_3", "to_step": "s_kapil_4", "reasoning": "The two emails are the pretext for the call; a call without them in his inbox is a cold call."}, {"edge_id": "e_same_1", "type": "same_day", "from_step": "s_kapil_4", "to_step": "s_kapil_5", "reasoning": "Voicemail is the immediate no-answer branch of the call attempt, left the same session."}, {"edge_id": "e_esc_1", "type": "wait_no_reply", "from_step": "s_kapil_1", "to_step": "s_ashley_1", "wait_days": 5, "reasoning": "Cross-thread escalation gate: the CFO thread activates only if the digital owner ignored the opener, so the cost flank does not undercut the lead thread."}, {"edge_id": "e_seq_3", "type": "sequence", "from_step": "s_ashley_1", "to_step": "s_ashley_2", "reasoning": "The cost email is the pretext for the finance call."}, {"edge_id": "e_same_2", "type": "same_day", "from_step": "s_ashley_2", "to_step": "s_ashley_3", "reasoning": "Voicemail is the same-session no-answer branch of the finance call."}, {"edge_id": "e_esc_2", "type": "wait_no_reply", "from_step": "s_ashley_1", "to_step": "s_mariela_1", "wait_days": 4, "reasoning": "Second escalation gate: the CEO is contacted only if the CFO stayed silent, so the top of the house is a last flank rather than a first touch."}, {"edge_id": "e_seq_4", "type": "sequence", "from_step": "s_mar actly the surface Wyllo covers. Lead with the dated fraud exposure and what we would cover, not with a vendor swap we cannot confirm.", "reasoning": "The brief's dated signals are the counterfeit dockets (July 8 Yan Yan case citing seized goods, plus the June and July filings) and the dense July drop cadence, both fresher than any incumbent-renewal clock, which is why the fraud-threat motion leads. The public complaint surface (July 14 Global-E return friction, June delivery claim marked not received) all lands after checkout. A network re-scan proved the earlier fraud-vendor signal was that vendor scoring Global-E cross-border orders through Global-E's own pixel rather than the brand running it, so no specific fraud vendor can be confirmed and none is named. Credo Beauty is the matched lookalike because it shares the high-demand branded inventory, reseller, return, and chargeback profile.", "priority": "P1", "window": {"start_date": "2026-07-24"}}, "threads": [{"thread_id": "t_jerry", "person": {"name": "Jerry Lorenzo", "title": "Fashion Designer at Fear of God", "role": "economic_buyer", "responsibility": "Vision control and, since the April 2026 CEO-role elimination, a larger hands-on role in daily operations including drop execution and brand protection.", "linkedin_url": "https://www.linkedin.com/in/jerry-lorenzo-3b7492206", "email": "lorenzo@fearofgod.com", "phone": null, "photo_url": "", "person_page": "/wyllo-demo/people/jerry-lorenzo-3b7492206.html"}, "targeting_reasoning": "Lead person: after the CEO role was eliminated he owns operating quality, so brand abuse, drop execution, and support friction now land at founder level. Company-level exec altitude.", "angle": {"campaign": "fraud_threat", "summary": "Active counterfeit enforcement plus peak drop traffic at once concentrates reseller, returns, and claims abuse that lands after checkout.", "reasoning": "Keys to what he owns now (execution quality across drops and brand protection) and to the freshest dat heckout declines and returns load during the drops", "body": "Jason, with the Summer Essentials and MLB drops live, two problems tend to spike together. Genuine shoppers hit a fraud error at checkout during the traffic surge. The returns and claims volume climbs afterward through Returnly and Global-E. A checkout screen alone leaves both of those open. Wyllo runs alongside your Shopify stack, reduces the false declines on real buyers, and scores returns and delivery claims so refunds stop leaking. Credo Beauty runs a close model with us. Want to see how the checkout piece would fit?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_jason_2", "thread_id": "t_jason", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 3, "timing_reasoning": "Lighter second surface two days after the email so the name is already familiar in his inbox.", "channel_reasoning": "LinkedIn is always available and adds a second surface without repeating the email paragraph.", "content_reasoning": "One line of relevance tied to the drops, references the email he already has, no pitch dump, under 300 characters.", "content": {"subject": null, "body": null, "note": "Jason, watching the Summer Essentials and MLB drops from outside and curious how you keep checkout clean when traffic spikes. I work on fraud and returns risk for Shopify brands and sent you a note on it. Would value connecting.", "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_jason_3", "thread_id": "t_jason", "channel": "linkedin", "step_type": "linkedin_dm", "day_offset": 6, "timing_reasoning": "Sent only if the connection is accepted, a few days after the request.", "channel_reasoning": "DM after acceptance is the natural warm follow to the connection note.", "content_reasoning": "Conversational, one question that lets him pick the bigger pain, on ": "The founder thread opens only after the champion thread stays silent.", "channel_reasoning": "Email carries the number-bearing cost and approval comparison.", "content_reasoning": "States the pricing fact once, with fatty15 as the proof point.", "content": {"subject": "fraud cost and approval rate vs Signifyd", "body": "MaryRuth, as the subscription and live commerce engine scales, fraud cost shows up in two places, the fee per approved order and the revenue lost to promo abuse and failed subscription payments. Wyllo screens checkout for roughly half what Signifyd costs and also covers that promo and subscription side in one place. fatty15 runs a similar subscription first supplement model and moved checkout, chargebacks, and subscription payment reliability to us. I wrote to Wyatt on the growth side about the detail. Could we send you a side by side on approval rate and cost?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_maryruth_2", "thread_id": "t_maryruth_ghiyam", "channel": "phone", "step_type": "phone_call", "day_offset": 10, "timing_reasoning": "The call follows only if the founder email is unanswered.", "channel_reasoning": "A call turns the email into a short numbers conversation.", "content_reasoning": "Beats: reason, the comparison, the proof, the ask.", "content": {"subject": null, "note": null, "talking_points": ["Open: MaryRuth, this is the Wyllo team, ecommerce fraud and risk for subscription brands.", "Reason for calling: the email on fraud cost and approval economics vs Signifyd as the growth engine scales.", "The one point: Wyllo covers checkout plus the promo and subscription side in one place, and the cost and approval rate side by side are in my email.", "Proof: fatty15 runs a similar subscription first model with us.", "Ask: worth twenty minutes to compare your Signifyd numbers against ours.", "If no pickup: leave the same day voicemail pointing at th e on returns and claims. They moved the repeat abuse decisions into the same system that screens checkout, so trusted buyers kept fast refunds while repeat offenders got stopped. Given the Madhappy drop and the new fragrance line, is that split something ROXY handles inside Forter today, or does it sit with CX?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tim_1", "thread_id": "t_tim", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Day after the opener so the cross-reference to Adam's email is already true; staggered, not blasted on day 0.", "channel_reasoning": "Email is the forwardable format for a channel-risk point and carries the coordination line to Adam.", "content_reasoning": "Frame promo and reseller risk not traveling to marketplaces; cite the DIVEIN15 propagation and Madhappy; reference the email to Adam; ask where marketplace risk sits.", "content": {"subject": "ROXY risk across marketplaces, not just the cart", "body": "Tim, as ROXY discovery and conversion move into marketplaces through the Flywheel work, the promo and reseller patterns you see on roxy.com do not automatically travel to those channels. The DIVEIN15 code is already circulating on public coupon sites, and a drop like Madhappy invites reseller buying. Wyllo scores repeat abuse and reseller behavior consistently across channels, not only the owned cart. I wrote to Adam Kronengold about the checkout and claims side. Where does marketplace risk sit for you today?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_tim_2", "thread_id": "t_tim", "channel": "linkedin", "step_type": "linkedin_connection_note", "day_offset": 3, "timing_reasoning": "Two days after his email so the second surface follows a real prior touch.", "channel_reasoning": "A light connection note keeps the channel-cons n follow-up. Going over the budget owner's head earlier would burn the lead thread.", "channel_reasoning": "Email is CEO-native and forwardable; a company-level loss-control note lands as follow-through given the disclosed prior contact.", "content_reasoning": "Keep it strategic: loss-control consistency as the platform scales, one ROXY illustration, disclose the email to Adam, ask who owns the decision for the DTC brands. No product detail, no pricing figure.", "content": {"subject": "Loss control as ROXY and the portfolio scale", "body": "Matt, as you scale the platform and add categories, marketplaces, and partners, the consistency of loss control becomes an operating question, not just a tooling one. On ROXY alone there is a live drop, a welcome code circulating publicly, and Seel claims, each a place where repeat abuse leaks margin. Wyllo covers checkout and the post purchase side in one system and reads risk inside the CX tools your teams already use. I emailed Adam Kronengold on the digital side earlier. Who owns this call for the DTC brands?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_matt_2", "thread_id": "t_matt", "channel": "phone", "step_type": "phone_call", "day_offset": 11, "timing_reasoning": "Two days after the CEO email; the email is the pretext so the call is not cold.", "channel_reasoning": "One live attempt on the play, in the escalation lane, to convert a sent email into a conversation.", "content_reasoning": "Beats, not a script: open, reason for calling, the one loss-control point, the ownership question, voicemail fallback.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Open: Matt, this is [name] from Wyllo, calling about loss control across the ROXY and portfolio DTC brands.", "Reason: sent a short email a couple of days ago on where repeat abuse leaks margin across checkout, claims, and promo codes.", "One point: Wyllo covers checkout screening and the returns and claims side in one system, inside the CX tools the teams already use.", "Ask: who owns the fraud and loss control decision for the DTC brands.", "If no answer: leave the voicemail pointing back to the email."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_matt_3", "thread_id": "t_matt", "channel": "phone", "step_type": "voicemail", "day_offset": 11, "timing_reasoning": "Same-day pair with the call attempt; left immediately on no answer.", "channel_reasoning": "A short voicemail pointing back at the email raises the odds the email gets opened.", "content_reasoning": "Name, one gap, and a pointer to the email; not a pitch, roughly twenty seconds.", "content": {"subject": null, "body": null, "note": null, "talking_points": ["Matt, this is [name] at Wyllo. Left you a short email about loss control across ROXY and the DTC brands as they scale, checkout plus the returns and claims side in one system.", "One ask: who owns that decision for the brands.", "The detail is in the email I sent, subject about loss control as ROXY scales. Thanks."], "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}], "edges": [{"edge_id": "e_seq_1", "type": "sequence", "from_step": "s_adam_1", "to_step": "s_adam_2", "reasoning": "Email before the connection note so the note leans on a real prior touch instead of arriving cold."}, {"edge_id": "e_acc_1", "type": "wait_accepted", "from_step": "s_adam_2", "to_step": "s_adam_3", "wait_days": 5, "reasoning": "The DM lane only exists after acceptance; five-day window before falling back."}, {"edge_id": "e_noacc_1", "type": "wait_no_reply", "from_step": "s_adam_2", "to_step": "s_adam_4", "wait_days": 5, "reasoning": "Complement of e_acc_1: unaccepted after five days sends the InMail instead; whichever branch fires, the other step is skipped."}, {"edge_id": "e_wait_1", "type": "wait_no_reply", "from_step": "s_adam_1", "to_step" ct, Evin. One question: with the Crusher 1080 live, does false declines on good launch orders get more attention, or the returns and warranty load that follows? Wyllo scores the same shopper across checkout, returns, and claims in one history, so a launch buyer and a serial returner are not read the same way. Can share what similar compact goods brands run into if useful."}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_evin_4", "thread_id": "t_evin_catlett", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 4, "timing_reasoning": "Complementary fallback when the note is not accepted.", "channel_reasoning": "InMail reaches her without an accepted connection.", "content_reasoning": "Restates the benchmark with one ask.", "content": {"subject": "post purchase risk next to your Riskified numbers", "body": "Evin, I sent a connection note and am adding this here too. The Riskified case is strong on checkout, and with the Crusher 1080 launch live the open question is whether that visibility carries into returns and warranty claims. Wyllo screens checkout and scores the same shopper across returns and claims in one history. Would fifteen minutes to put the two side by side, approval rate included, be worth it?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_jillian_1", "thread_id": "t_jillian_hough", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Staggered a day behind the lead so the threads run in parallel.", "channel_reasoning": "Email carries the operations framing she can forward.", "content_reasoning": "Frames launch returns and warranty claims as ops load, names the Evin touch.", "content": {"subject": "launch returns and warranty claims on ops", "body": "Jillian, a flagship launch like the Crusher 1080 usually brings a wave of returns, warranty claims, and item not received claims that land as manual work on  and claims and promo abuse decisions sit in separate workflows from checkout. Wyllo matches checkout screening and adds post purchase coverage across returns, claims, and promo abuse.", "reasoning": "Signifyd is the given incumbent with public Signifyd and Tuckernuck returns context, and the freshest signal is a checkout and post purchase role actively evaluating payment, fraud, and returns vendors. The wedge is post purchase breadth, with approval rate economics second. That maps a displacement pitch to product and checkout (Bianca), operations and returns (Emily), and the CFO who owns vendor cost.", "priority": "P1", "window": {"start_date": "2026-07-23"}}, "threads": [{"thread_id": "t_bianca_vitarello", "person": {"name": "Bianca Vitarello", "title": "Director of Product at Tuckernuck", "role": "champion", "responsibility": "Owns checkout and post purchase product, including payment authorization, returns and order issue workflows, and the vendor evaluation behind them.", "linkedin_url": "https://www.linkedin.com/in/biancavitarello", "email": "bvitarello@tnuck.com", "phone": "+1 240-285-7611", "photo_url": "https://media.licdn.com/dms/image/v2/D4E03AQFCCa_MegfbTA/profile-displayphoto-crop_800_800/B4EZgZ7ZZCGYAI-/0/1752781657967?e=1786579200&v=beta&t=Ci9VyeYZ_hDJuZkqP_7sbIEh9v_C-TtlyD6GJaCPk7w", "person_page": "/wyllo-demo/people/biancavitarello.html"}, "targeting_reasoning": "She owns the checkout and post purchase product surface and the fraud and returns vendor evaluation, so a stack comparison is hers to drive. The brief points the lead at the role monitoring auth rates and returns.", "angle": {"campaign": "incumbent_displacement", "summary": "Checkout fraud screening focuses on the payment moment; returns, promo leakage, delivery claims, and CX policy decisions play out after the sale. Wyllo scores one shopper history across all of them.", "reasoning": "Her remit spans exactly the split the wedge targets, so the open vendor evaluation is a low friction reaso ", "channel_reasoning": "The DM is the warm follow up once connected.", "content_reasoning": "One question on where the split hurts, no repeated sentences.", "content": {"subject": null, "note": null, "talking_points": null, "engagement_target_url": null, "body": "Appreciate the connect, Bianca. One question: with returns staying generous and beauty expanding, is promo leakage or return abuse the harder one to see right now? Wyllo scores the same shopper across checkout, returns, and claims in one place, so the pattern shows up before the credit does. Can share what similar apparel brands run into if useful."}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_bianca_4", "thread_id": "t_bianca_vitarello", "channel": "linkedin", "step_type": "linkedin_inmail", "day_offset": 4, "timing_reasoning": "Complementary fallback when the note is not accepted.", "channel_reasoning": "InMail reaches her without an accepted connection.", "content_reasoning": "Restates the value with one comparison ask.", "content": {"subject": "checkout and returns in one risk view", "body": "Bianca, I sent a connection note and am adding this here too. On a catalog with generous returns and a beauty expansion, a single shopper history across checkout, returns, and claims is where the promo and return abuse actually shows up. Wyllo scores that one view. Would fifteen minutes to compare what each side catches, and how our approval rate lands against yours, be useful?", "note": null, "talking_points": null, "engagement_target_url": null}, "state": "draft", "outcome": {"status": "none"}}, {"step_id": "s_emily_1", "thread_id": "t_emily_grayson", "channel": "email", "step_type": "email", "day_offset": 1, "timing_reasoning": "Staggered a day behind the lead so the threads run in parallel.", "channel_reasoning": "Email carries the operations framing she can forward.", "content_reasoning": "Frames returns abuse as ops load, uses Everlane as the proof that generous returns can stay, names   function firstName(n) { return String(n || "").trim().split(/\s+/)[0] || n; }
  function titleize(s) {
    return String(s || "").replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }
  // kind: "avatar" (cast card) or "thumb" (step chip). Falls back to initials circle.
  function avatarHTML(p, kind) {
    var pic = p && p.photo_url ? String(p.photo_url).trim() : "";
    var imgCls = kind === "thumb" ? "thumb" : "avatar";
    var initCls = kind === "thumb" ? "thumb-init" : "avatar-init";
    if (pic) return '<img class="' + imgCls + '" src="' + esc(pic) + '" alt="">';
    return '<span class="' + initCls + '">' + esc(initials(p && p.name)) + "</span>";
  }

  var STEPTYPE_LABEL = {
    linkedin_connection_note: "LinkedIn \u00b7 Connection request",
    linkedin_dm: "LinkedIn \u00b7 Message",
    linkedin_inmail: "LinkedIn \u00b7 InMail",
    email: "Email",
    phone_call: "Phone call",
    voicemail: "Voicemail"
  };
  function stepTypeLabel(st) { return STEPTYPE_LABEL[st] || titleize(st); }
  function dayText(d) { return d === 0 ? "Day 0" : "Day " + d; }

  // ---- per-play render (PLAY + indexes rebuilt each time) ----
  function renderPlay(PLAY) {
    var threadById = {};
    var colorByThread = {};
    PLAY.threads.forEach(function (t, i) {
      threadById[t.thread_id] = t;
      colorByThread[t.thread_id] = PALETTE[i % PALETTE.length];
    });
    var stepById = {};
    PLAY.steps.forEach(function (s) { stepById[s.step_id] = s; });
    var incoming = {};
    (PLAY.edges || []).forEach(function (ed) {
      (incoming[ed.to_step] = incoming[ed.to_step] || []).push(ed);
    });
    function personOf(step) { return (threadById[step.thread_id] || {}).person || {}; }

    // ---- strategy header ----
    function renderStrategy() {
      var a = PLAY.account, s = PLAY.strategy || {};
      var inc = (a.incumbent || []).join(", ") || "the incumbent";
      var camps = (s.campaigns || []).map(function (c) {
        return '<span class="pill camp">' + esc(titleize(c)) + "</span>";
      }).join(" ");
      var prio = s.priority ? '<span class="pill prio">' + esc(s.priority) + " \u00b7 work now</span>" : "";
      var verif = PLAY.verified
        ? '<span class="pill ok" title="Fact-checked against its research bundle">\u2713 Verified</span>'
        : '<span class="pill pending" title="Not yet fact-checked">Draft \u2014 pending verification</span>';
      var win = (s.window && s.window.start_date)
        ? '<div class="window">Window opens ' + esc(s.window.start_date) + "</div>" : "";
      var nPeople = PLAY.threads.length;
      var peopleWord = nPeople + "-person";
      return '' +
        '<div class="strategy">' +
          '<div class="toprow">' +
            "<h1>" + esc(a.name) + "</h1>" +
            '<span class="domain">' + esc(a.domain) + "</span>" +
            '<span style="flex:1"></span>' + verif + " " + prio + " " + camps +
          "</div>" +
          '<p class="displace">Displace <span class="vs">' + esc(inc) +
            "</span> across a coordinated, " + esc(peopleWord) + " sequence.</p>" +
          (s.thesis ? '<p class="thesis">' + esc(s.thesis) + "</p>" : "") +
          (s.reasoning ? '<p class="reasoning-lite">' + esc(s.reasoning) + "</p>" : "") +
          win +
        "</div>";
    }

    // ---- cast ----
    function touchesFor(threadId) {
      var days = PLAY.steps.filter(function (st) { return st.thread_id === threadId; })
        .map(function (st) { return st.day_offset; });
      var uniq = [];
      days.sort(function (a, b) { return a - b; }).forEach(function (d) {
        if (uniq.indexOf(d) === -1) uniq.push(d);
      });
      var count = PLAY.steps.filter(function (st) { return st.thread_id === threadId; }).length;
      return count + " touch" + (count === 1 ? "" : "es") + " \u00b7 " +
        uniq.map(function (d) { return "Day " + d; }).join(", ");
    }
    // Person name -> clickable link. Prefer the on-site person page; fall back to
    // their LinkedIn profile (new tab) when no person page was injected.
    function personNameLink(p) {
      if (p && p.person_page) {
        return '<a href="' + esc(p.person_page) + '">' + esc(p.name) + "</a>";
      }
      if (p && p.linkedin_url) {
        return '<a href="' + esc(p.linkedin_url) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a>";
      }
      return esc(p && p.name);
    }
    function renderCast() {
      var cards = PLAY.threads.map(function (t) {
        var col = colorByThread[t.thread_id];
        var p = t.person || {};
        var li = p.linkedin_url
          ? ' \u00b7 <a class="li" href="' + esc(p.linkedin_url) + '" target="_blank" rel="noopener">LinkedIn</a>' : "";
        return '' +
          '<div class="person" style="--c:' + col.c + ";--cbg:" + col.bg + '">' +
            '<div class="phead">' + avatarHTML(p, "avatar") +
              '<div class="pmeta">' +
                '<div class="pname"><span class="dot"></span>' + personNameLink(p) + "</div>" +
                '<div class="ptitle">' + esc(p.title || "") + "</div>" +
              "</div>" +
            "</div>" +
            '<span class="rolechip">' + esc(titleize(p.role || "")) + "</span>" +
            '<div class="angle">' + esc((t.angle && t.angle.summary) || "") + "</div>" +
            '<div class="why"><b>Why them:</b> ' + esc(t.targeting_reasoning || "") + "</div>" +
            '<div class="touches">' + touchesFor(t.thread_id) + li + "</div>" +
          "</div>";
      }).join("");
      return '<h2 class="sec">Who we\'re reaching &amp; why</h2><div class="cast">' + cards + "</div>";
    }

    // ---- coordination badges (from incoming edges) ----
    function badge(cls, icon, text, tip) {
      var t = tip ? ' title="' + esc(tip) + '"' : "";
      return '<span class="badge ' + cls + '"' + t + '><span class="ic">' + icon +
        "</span>" + text + "</span>";
    }
    function badgesFor(step) {
      var eds = incoming[step.step_id] || [];
      if (!eds.length) return "";
      var out = eds.map(function (ed) {
        var from = stepById[ed.from_step] || {};
        var fromPerson = personOf(from);
        var fromName = firstName(fromPerson.name);
        var sameThread = from.thread_id === step.thread_id;
        var wd = ed.wait_days;
        if (ed.type === "wait_accepted") {
          return badge("branch", "\u2713", "Only after " + esc(fromName) + " accepts (" + dayText(from.day_offset) + ")");
        }
        if (ed.type === "wait_no_reply") {
          if (!sameThread) {
            return badge("gate", "\u2197", "Escalation \u2014 only if " + esc(fromName) +
              " stays silent " + (wd != null ? wd + " days" : "") );
          }
          return badge("branch", "\u27f3", "If no reply" + (wd != null ? ", " + wd + " days later" : ""));
        }
        if (ed.type === "same_day") {
          return badge("same", "\u25cf", "Same day as the " + esc(stepTypeLabel(from.step_type).toLowerCase()));
        }
        if (ed.type === "cross_reference") {
          return badge("xref", "\u21b3", "Names the outreach to " + esc(fromName), ed.reference_note);
        }
        if (ed.type === "sequence") {
          return badge("same", "\u2192", "Follows the " + esc(stepTypeLabel(from.step_type).toLowerCase()));
        }
        return "";
      }).join("");
      return out ? '<div class="coord">' + out + "</div>" : "";
    }

    // ---- copy block ----
    function renderCopy(step) {
      var c = step.content || {};
      var hasSubject = c.subject && String(c.subject).trim();
      var hasBody = c.body && String(c.body).trim();
      var hasNote = c.note && String(c.note).trim();
      var hasTP = c.talking_points && c.talking_points.length;
      if (!hasSubject && !hasBody && !hasNote && !hasTP) {
        return '<div class="copy"><div class="draft">Draft pending</div></div>';
      }
      var html = '<div class="copy">';
      if (hasSubject) {
        html += '<div class="subj"><b>Subject</b>' + esc(c.subject) + "</div>";
      }
      if (hasBody) {
        html += '<div class="body">' + bodyParas(c.body) + "</div>";
      }
      if (hasNote) {
        html += '<div class="body">' + esc(c.note) + "</div>";
      }
      if (hasTP) {
        html += '<div class="notelabel">Talking points</div><ul class="tp">' +
          c.talking_points.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") +
          "</ul>";
      }
      html += "</div>";
      return html;
    }

    // ---- reasoning strip ----
    function renderReasoning(step) {
      var rows = [];
      if (step.timing_reasoning) rows.push(["When", step.timing_reasoning]);
      if (step.channel_reasoning) rows.push(["Channel", step.channel_reasoning]);
      if (step.content_reasoning) rows.push(["Copy", step.content_reasoning]);
      if (!rows.length) return "";
      var inner = '<div class="rz">' + rows.map(function (r) {
        return '<div class="rzline"><span class="rzk">' + esc(r[0]) +
          '</span><span class="rzv">' + esc(r[1]) + "</span></div>";
      }).join("") + "</div>";
      return '<details class="rz-wrap"><summary><span class="tri">\u25b6</span>Why this move</summary>' +
        inner + "</details>";
    }

    // ---- step card ----
    function renderStep(step) {
      var col = colorByThread[step.thread_id];
      var p = personOf(step);
      return '' +
        '<article class="step" style="--c:' + col.c + '">' +
          '<div class="step-head">' +
            '<span class="who">' + avatarHTML(p, "thumb") + '<span class="dot"></span>' + esc(p.name) +
              (p.title ? ' <span class="who-title">\u00b7 ' + esc(p.title) + "</span>" : "") + "</span>" +
            '<span class="chan ' + esc(step.channel) + '">' + esc(step.channel) + "</span>" +
            '<span class="steptype">' + esc(stepTypeLabel(step.step_type)) + "</span>" +
          "</div>" +
          badgesFor(step) +
          renderCopy(step) +
          renderReasoning(step) +
        "</article>";
    }

    // ---- timeline (chronological, grouped by day) ----
    function renderTimeline() {
      var steps = PLAY.steps.slice();
      steps.forEach(function (s, i) { s._idx = i; });
      steps.sort(function (a, b) {
        return (a.day_offset - b.day_offset) || (a._idx - b._idx);
      });
      var groups = [];
      var cur = null;
      steps.forEach(function (s) {
        if (!cur || cur.day !== s.day_offset) {
          cur = { day: s.day_offset, steps: [] };
          groups.push(cur);
        }
        cur.steps.push(s);
      });
      var html = '<h2 class="sec">The sequence over time</h2><div class="timeline">';
      groups.forEach(function (g) {
        html += '<div class="day">' +
          '<div class="day-label"><span class="day-badge">' + esc(dayText(g.day)) + "</span></div>" +
          '<div class="day-steps">' + g.steps.map(renderStep).join("") + "</div>" +
        "</div>";
      });
      html += "</div>";
      return html;
    }

    document.getElementById("app").innerHTML =
      renderStrategy() + renderCast() + renderTimeline();
    document.getElementById("foot").textContent =
      "Play " + PLAY.play_id + " \u00b7 generated " + (PLAY.created_at || "") +
      " \u00b7 status: " + (PLAY.status || "draft") + " (copy is a draft, not yet sent)";
    document.title = PLAY.account.name + " \u2014 Outreach Play";
  }

  // ---- selector + routing ----
  function currentDomain() {
    var h = (location.hash || "").replace(/^#/, "");
    var m = (location.search || "").match(/[?&]a=([^&]+)/);
    var q = m ? decodeURIComponent(m[1]) : "";
    var want = h || q;
    if (want && PLAYS[want]) return want;
    return ORDER[0].domain;
  }
  function select(domain) {
    if (!PLAYS[domain]) domain = ORDER[0].domain;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-domain") === domain);
    });
    renderPlay(PLAYS[domain]);
    window.scrollTo(0, 0);
  }
  function buildTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = ORDER.map(function (o) {
      return '<button class="tab" data-domain="' + esc(o.domain) + '" type="button">' +
        esc(o.name) + '<span class="dom">' + esc(o.domain) + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () {
        var d = b.getAttribute("data-domain");
        if (location.hash.replace(/^#/, "") !== d) { location.hash = d; }
        else { select(d); }
      });
    });
  }
  window.addEventListener("hashchange", function () { select(currentDomain()); });

  buildTabs();
  select(currentDomain());
})();
</script>
